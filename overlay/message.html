<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  :root{ --accent:#e9ff1f; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:transparent; overflow:hidden; user-select:none; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
  body{ padding:10px 16px 18px; }
  .card{ display:flex; align-items:center; gap:14px; background:linear-gradient(180deg,#141821,#0d0f15);
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:14px 18px; box-shadow:0 14px 40px rgba(0,0,0,.55); }
  .card.in{ animation:in .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes in{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none; } }
  .spk{ font-size:30px; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(233,255,31,.4)); }
  .spk.playing{ animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.14);} }
  .txt{ font-size:15px; font-weight:600; line-height:1.3; flex:1; min-width:0; }
  .who{ font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--accent); text-transform:uppercase; margin-bottom:3px; }
  #msg{ word-break:break-word; }
</style>
</head>
<body>
  <div class="card in" id="card">
    <div class="spk" id="spk">🔊</div>
    <div class="txt"><div class="who">Mensaje del admin</div><div id="msg"></div></div>
  </div>
<script>
  const { ipcRenderer } = require('electron');
  let audio = null;
  function done(){ clearTimeout(window._t); if (audio){ try{ audio.pause(); }catch(e){} audio=null; } ipcRenderer.send('msg-done'); }
  ipcRenderer.on('admin-msg', (_e, m) => {
    document.getElementById('msg').textContent = m.text || (m.audio ? '🎤 Mensaje de voz' : '');
    const card = document.getElementById('card'), spk = document.getElementById('spk');
    card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
    if (audio){ try{ audio.pause(); }catch(e){} audio=null; }
    spk.classList.remove('playing');
    let closeMs = m.text ? 7000 : 6000;
    if (m.audio){
      try {
        audio = new Audio(m.audio); audio.volume = (m.volume!=null) ? Math.max(0,Math.min(1,m.volume)) : 0.9;
        spk.classList.add('playing');
        audio.play().catch(()=>{});
        audio.onended = () => { spk.classList.remove('playing'); setTimeout(done, 2500); };
        closeMs = 30000;   // respaldo por si el audio no dispara 'ended'
      } catch(e){}
    }
    clearTimeout(window._t); window._t = setTimeout(done, closeMs);
  });
</script>
</body>
</html>
