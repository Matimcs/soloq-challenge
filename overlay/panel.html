<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  :root{ --line:rgba(255,255,255,.09); --text:#fff; --muted:rgba(255,255,255,.55); --accent:#e9ff1f; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:transparent; overflow:hidden; user-select:none; font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); }
  .shell{ background:#0b0b0b; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 12px 50px rgba(0,0,0,.6); height:100vh; display:flex; flex-direction:column; position:relative; }
  .bar{ display:flex; align-items:center; gap:10px; padding:8px 14px; background:#0b0b0b; border-bottom:1px solid var(--line); cursor:move; }
  .logo{ width:20px; height:20px; border-radius:5px; object-fit:contain; }
  .btitle{ font-weight:700; font-size:13px; }
  .hint{ margin-left:auto; font-size:11px; color:var(--muted); }
  .hint b{ color:var(--text); background:rgba(255,255,255,.08); padding:1px 6px; border-radius:5px; }
  .gear{ background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--text); width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:13px; margin-left:10px; }
  .gear:hover{ background:rgba(255,255,255,.18); }
  .xbtn{ background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--text); width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:13px; margin-left:8px; }
  .xbtn:hover{ background:rgba(255,255,255,.18); }
  .rk{ flex:1; overflow-y:auto; padding:6px 10px 10px; user-select:text; }
  .rk::-webkit-scrollbar{ width:8px; } .rk::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; }
  .row{ display:grid; grid-template-columns:26px 34px 1fr auto; align-items:center; gap:10px; padding:7px 8px; border-radius:10px; }
  .row + .row{ border-top:1px solid rgba(255,255,255,.05); }
  .row.me{ background:rgba(233,255,31,.08); outline:1px solid rgba(233,255,31,.35); }
  .pos{ font-weight:800; font-size:14px; color:var(--muted); text-align:center; }
  .row:nth-child(1) .pos{ color:#ffd24a; } .row:nth-child(2) .pos{ color:#c9d1d9; } .row:nth-child(3) .pos{ color:#d9915a; }
  .crest{ width:34px; height:34px; object-fit:contain; }
  .nm{ font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live{ display:inline-block; font-size:9.5px; font-weight:800; color:#0b0b0b; background:#4ade80; border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:1px; }
  .sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .sub b{ color:#c4b5fd; font-weight:700; }
  .form{ display:flex; gap:3px; justify-content:flex-end; margin-top:5px; }
  .form i{ width:7px; height:7px; border-radius:2px; background:#fb7185; } .form i.w{ background:#4ade80; }
  .wr{ text-align:right; font-size:12px; font-weight:700; } .wr small{ display:block; font-size:10.5px; color:var(--muted); font-weight:600; }
  .rkfoot{ display:flex; align-items:center; gap:10px; padding:8px 14px; border-top:1px solid var(--line); font-size:11px; color:var(--muted); }
  .rkfoot button{ margin-left:auto; background:var(--accent); color:#000; border:none; border-radius:8px; padding:7px 12px; font-weight:800; font-size:11.5px; cursor:pointer; }
  .empty{ padding:40px 10px; text-align:center; color:var(--muted); font-size:13px; }
  .settings{ position:absolute; inset:0; background:rgba(6,7,10,.94); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); padding:28px 34px; display:flex; flex-direction:column; gap:14px; }
  .stitle{ font-size:17px; font-weight:800; }
  .opt{ display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; }
  .opt input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
  .opt.col{ flex-direction:column; align-items:flex-start; gap:6px; }
  .opt.col input[type=range]{ width:260px; accent-color:var(--accent); cursor:pointer; }
  .sbtn{ align-self:flex-start; background:var(--accent); color:#000; border:none; border-radius:8px; padding:9px 16px; font-weight:700; font-size:12px; cursor:pointer; }
  .snote{ font-size:11px; color:var(--muted); margin-top:auto; }
  .sclose{ position:absolute; top:14px; right:16px; background:rgba(255,255,255,.08); border:1px solid var(--line); color:var(--text); width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
  <div class="shell">
    <div class="bar" id="head">
      <img class="logo" src="assets/logo.png" alt=""><div class="btitle">SoloQ Challenge</div>
      <div class="hint">Ocultar: <b>Alt&nbsp;+&nbsp;X</b></div>
      <button class="gear" id="gear" title="Configuración">⚙</button>
      <button class="xbtn" id="close-all" title="Minimizar (Alt+X) — el overlay sigue funcionando en la bandeja" aria-label="Minimizar">—</button>
    </div>
    <!-- Solo el ranking (sin navegador interno): para todo lo demás, "Abrir la web" en el navegador del jugador. -->
    <div class="rk" id="rk"><div class="empty">Cargando ranking…</div></div>
    <div class="rkfoot"><span id="rk-upd"></span><button id="open-site">Abrir la web ↗</button></div>

    <div class="settings" id="settings" style="display:none">
      <button class="sclose" id="s-close" title="Cerrar">✕</button>
      <div class="stitle">⚙ Configuración</div>
      <label class="opt"><input type="checkbox" id="s-small"> Mostrar tarjeta de standing</label>
      <label class="opt"><input type="checkbox" id="s-shell"> Mostrar popup de Blue Shells</label>
      <label class="opt"><input type="checkbox" id="s-autostart"> Abrir al iniciar el PC</label>
      <label class="opt"><input type="checkbox" id="s-aot"> Siempre encima (always-on-top)</label>
      <label class="opt"><input type="checkbox" id="s-lock"> Bloquear overlays (evita moverlos sin querer al jugar)</label>
      <label class="opt col"><span>Opacidad <b id="s-op-val"></b></span><input type="range" id="s-op" min="30" max="100"></label>
      <label class="opt col"><span>Volumen (efectos / ruleta) <b id="s-vol-val"></b></span><input type="range" id="s-vol" min="0" max="100"></label>
      <label class="opt col"><span>Volumen de mensajes de voz <b id="s-vvol-val"></b></span><input type="range" id="s-vvol" min="0" max="100"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="sbtn" id="s-position" style="background:#e9ff1f;color:#000;border:1px solid #e9ff1f;font-weight:800">🎯 Posicionar overlays</button>
        <button class="sbtn" id="s-reset">Reponer posiciones</button>
        <button class="sbtn" id="s-folder" style="background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)" title="Abre la carpeta donde está instalado el overlay">📂 Abrir carpeta del programa</button>
        <button class="sbtn" id="s-update" style="background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)">Buscar actualizaciones</button>
        <button class="sbtn" id="s-quit" style="background:rgba(251,113,133,.16);color:#fb7185;border:1px solid rgba(251,113,133,.45)">Salir del overlay</button>
      </div>
      <div class="snote"><b>Minimizar</b> (Alt+X / —) solo esconde el overlay; sigue corriendo en la bandeja para trackear. <b>Salir del overlay</b> lo cierra por completo.<br>Los cambios se guardan automáticamente. SoloQ Overlay <span id="s-version">—</span></div>
    </div>
  </div>

<script>
  const { ipcRenderer } = require('electron');
  const $ = id => document.getElementById(id);
  const settingsEl = $('settings');
  ipcRenderer.invoke('get-version').then(v => { const el = $('s-version'); if (el) el.textContent = 'v' + v; }).catch(() => {});
  async function openSettings(){
    const s = await ipcRenderer.invoke('get-settings');
    $('s-small').checked=!!s.smallVisible; $('s-shell').checked=!!s.shellVisible;
    $('s-aot').checked=!!s.alwaysOnTop;
    $('s-lock').checked = s.locked !== false;
    $('s-autostart').checked = s.autoLaunch !== false;
    const op=Math.round((s.opacity!=null?s.opacity:1)*100); $('s-op').value=op; $('s-op-val').textContent=op+'%';
    const vol=Math.round((s.volume!=null?s.volume:0.8)*100); $('s-vol').value=vol; $('s-vol-val').textContent=vol+'%';
    const vvol=Math.round((s.voiceVolume!=null?s.voiceVolume:0.9)*100); $('s-vvol').value=vvol; $('s-vvol-val').textContent=vvol+'%';
    settingsEl.style.display='flex';
  }
  const set = (k,v) => ipcRenderer.send('setting',{key:k,value:v});
  $('gear').addEventListener('click', () => settingsEl.style.display==='flex' ? settingsEl.style.display='none' : openSettings());
  $('close-all').addEventListener('click', () => ipcRenderer.send('close-all'));   // solo OCULTA el overlay
  $('s-close').addEventListener('click', () => settingsEl.style.display='none');
  // Cuando el panel tiene el foco, el atajo GLOBAL Alt+X no siempre llega (Windows toma el Alt
  // para la ventana enfocada), así que el 2º Alt+X "no cerraba". Aquí lo escuchamos localmente:
  // Alt+X o Escape ocultan el panel aunque esté enfocado.
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' || (e.altKey && (e.key === 'x' || e.key === 'X'))){
      e.preventDefault();
      if (settingsEl.style.display === 'flex') { settingsEl.style.display = 'none'; return; }
      ipcRenderer.send('close-all');
    }
  });
  $('s-quit').addEventListener('click', () => { if (confirm('¿Cerrar el overlay por completo? Dejará de trackear hasta que lo vuelvas a abrir.')) ipcRenderer.send('quit-app'); });
  $('s-small').addEventListener('change', e => set('smallVisible', e.target.checked));
  $('s-shell').addEventListener('change', e => set('shellVisible', e.target.checked));
  $('s-autostart').addEventListener('change', e => set('autoLaunch', e.target.checked));
  $('s-aot').addEventListener('change', e => set('alwaysOnTop', e.target.checked));
  $('s-lock').addEventListener('change', e => set('locked', e.target.checked));
  $('s-op').addEventListener('input', e => { const v=+e.target.value; $('s-op-val').textContent=v+'%'; set('opacity', v/100); });
  $('s-vol').addEventListener('input', e => { const v=+e.target.value; $('s-vol-val').textContent=v+'%'; set('volume', v/100); });
  $('s-vvol').addEventListener('input', e => { const v=+e.target.value; $('s-vvol-val').textContent=v+'%'; set('voiceVolume', v/100); });
  $('s-reset').addEventListener('click', () => ipcRenderer.send('reset-pos'));
  $('s-folder').addEventListener('click', () => ipcRenderer.send('open-app-folder'));
  $('s-position').addEventListener('click', () => { settingsEl.style.display='none'; ipcRenderer.send('enter-positioning'); });
  $('s-update').addEventListener('click', () => {
    ipcRenderer.send('check-updates');
    const b = $('s-update'), t = b.textContent; b.textContent = 'Buscando…'; b.disabled = true;
    setTimeout(() => { b.textContent = t; b.disabled = false; }, 5000);
  });

  // ---- Ranking ----
  const TIER = { IRON:'Hierro', BRONZE:'Bronce', SILVER:'Plata', GOLD:'Oro', PLATINUM:'Platino', EMERALD:'Esmeralda', DIAMOND:'Diamante', MASTER:'Maestro', GRANDMASTER:'Gran Maestro', CHALLENGER:'Challenger', UNRANKED:'Sin rango' };
  const CREST = t => `assets/ranks/Season_2023_-_${t.charAt(0) + t.slice(1).toLowerCase()}.webp`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
  async function loadRanking(){
    let d; try { d = await ipcRenderer.invoke('get-ranking'); } catch (e) { return; }
    const ps = (d && d.players) || [], me = norm(d && d.me);
    if (!ps.length){ $('rk').innerHTML = '<div class="empty">No se pudo cargar el ranking. Revisa tu conexión.</div>'; return; }
    $('rk').innerHTML = ps.map((p, i) => {
      const t = p.tier || 'UNRANKED', ranked = t !== 'UNRANKED', g = (p.w || 0) + (p.l || 0), wr = g ? Math.round(p.w / g * 100) : null;
      const form = (p.form || []).slice(-10).map(w => `<i class="${w ? 'w' : ''}"></i>`).join('');
      return `<div class="row${norm(p.rid) === me ? ' me' : ''}">
        <div class="pos">${i + 1}</div>
        ${ranked ? `<img class="crest" src="${CREST(t)}" alt="">` : '<span></span>'}
        <div style="min-width:0"><div class="nm">${esc(p.nm || (p.rid || '').split('#')[0])}${p.inGame ? '<span class="live">EN PARTIDA</span>' : ''}</div>
          <div class="sub"><b>${TIER[t] || t}${p.div ? ' ' + p.div : ''}</b>${ranked ? ' · ' + (p.lp || 0) + ' LP' : ''}</div></div>
        <div class="wr">${wr != null ? wr + '% WR' : '—'}<small>${p.w || 0}V ${p.l || 0}D</small>${form ? `<div class="form">${form}</div>` : ''}</div>
      </div>`; }).join('');
    $('rk-upd').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
    if (!scrolled){ scrolled = true; const m = $('rk').querySelector('.row.me'); if (m) m.scrollIntoView({ block:'center' }); else $('rk').scrollTop = 0; }   // al abrir: arriba, o centrado en tu fila
  }
  let scrolled = false;
  ipcRenderer.on('panel-shown', () => { scrolled = false; loadRanking(); });
  $('open-site').addEventListener('click', () => ipcRenderer.send('open-site'));
  loadRanking();
  setInterval(() => { if (document.visibilityState === 'visible') loadRanking(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadRanking(); });

  const head = $('head'); let dragging=false;
  head.addEventListener('mousedown', e => { dragging=true; ipcRenderer.send('drag-start',{mx:e.screenX,my:e.screenY}); e.preventDefault(); });
  // Si se soltó el mouse FUERA de la ventana no llega el mouseup: sin botón apretado, el arrastre termina (si no, la ventana seguía al cursor).
  window.addEventListener('mousemove', e => { if(!dragging) return; if(!(e.buttons & 1)){ dragging=false; ipcRenderer.send('drag-end'); return; } ipcRenderer.send('drag-move',{mx:e.screenX,my:e.screenY}); });
  window.addEventListener('mouseup', () => { if(dragging){ dragging=false; ipcRenderer.send('drag-end'); } });
</script>
</body>
</html>
