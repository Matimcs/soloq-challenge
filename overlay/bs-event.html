<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{ --accent:#e9ff1f; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ background:transparent; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; user-select:none; }

  /* Notificación en partida (pequeña, esquina) */
  .notif{ display:none; align-items:center; gap:12px; margin:10px; padding:12px 14px; border-radius:12px;
    background:linear-gradient(180deg,#111318,#0c0d11); border:1px solid rgba(255,255,255,.1);
    box-shadow:0 12px 34px rgba(0,0,0,.55); color:#fff; animation:pop .3s ease; }
  @keyframes pop{ from{ opacity:0; transform:translateX(16px);} to{ opacity:1; transform:none; } }
  .notif img{ width:44px; height:44px; object-fit:contain; flex-shrink:0; }
  .nt{ font-size:12px; color:rgba(255,255,255,.75); }
  .nt b{ color:var(--accent); }
  .nc{ font-size:14px; font-weight:800; color:#fff; margin-top:2px; }

  /* Grip para REDIMENSIONAR (esquina inferior derecha) */
  .grip{ display:none; position:fixed; right:0; bottom:0; width:20px; height:20px; z-index:100002;
    cursor:nwse-resize; background:
      linear-gradient(135deg, transparent 50%, rgba(233,255,31,.55) 50%, rgba(233,255,31,.55) 60%, transparent 60%,
      transparent 72%, rgba(233,255,31,.55) 72%, rgba(233,255,31,.55) 82%, transparent 82%); }

  /* Ruleta MINIMAL en el overlay: sin backdrop oscuro ni marco — solo la rueda (+ resultado),
     para no tapar pantalla. Fondo transparente, sin borde/sombra/padding, sin título/hint. */
  .sqcr-overlay{ background:transparent !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; }
  .sqcr-box{ background:transparent !important; border:none !important; box-shadow:none !important; padding:0 !important; width:520px !important; }
  .sqcr-title, .sqcr-sub, .sqcr-hint{ display:none !important; }
  /* Track ceñido a los íconos (menos espacio muerto arriba/abajo) y fondo más transparente */
  .sqcr-track{ height:104px !important; margin:0 0 6px !important;
    background:rgba(10,11,15,.38) !important; border-color:rgba(255,255,255,.05) !important; }
  .sqcr-result{ min-height:20px !important; font-size:15px !important; }
</style>
</head>
<body>
  <div class="notif" id="notif">
    <img id="ni" src="" onerror="this.style.visibility='hidden'">
    <div><div class="nt" id="nt"></div><div class="nc" id="nc"></div></div>
  </div>

  <div class="grip" id="grip" title="Redimensionar"></div>
  <div id="possample" style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    outline:2px dashed #e9ff1f; outline-offset:-4px; border-radius:14px; background:rgba(12,16,24,.82); color:#eaeff6; font-family:system-ui,sans-serif; text-align:center;">
    <div style="font-size:30px">🛡</div>
    <div style="font-size:15px; font-weight:800">Carrusel de Blue Shell</div>
    <div style="font-size:12px; opacity:.7">Arrástralo y usa la esquina ◢ para el tamaño</div>
  </div>

<script src="roulette.js"></script>
<script>
  const { ipcRenderer } = require('electron');
  const $ = id => document.getElementById(id);
  const SLUG = { 'Sin tus 3 campeones más jugados':'sin-3-campeones','Una partida con Yuumi':'yuumi','Campeón aleatorio':'campeon-aleatorio','Sin Flash':'sin-flash','Autofill':'autofill','Sin botas y sin pies veloces':'sin-botas','Hechizos cambiados':'hechizos-cambiados','Sin pociones ni pinks':'sin-pociones','Sin objetos completos hasta min 15':'sin-objetos-min15','Reverse':'reverse','Clase de campeón aleatoria':'clase-campeon' };
  const AUDIO = 'assets/Roulette Sound.mp3';
  const IMG = 'assets/shells/';

  // Muestra/oculta el grip de redimensionar (solo en modo ruleta).
  function setChrome(on){ $('grip').style.display = on ? 'block' : 'none'; }
  // Modo posicionar: preview estático del carrusel (para moverlo/redimensionarlo), sin sonido ni ruleta.
  ipcRenderer.on('bs-sample', () => { try { cleanupRoulette(); } catch(e){} setChrome(true); const p=$('possample'); if(p) p.style.display='flex'; });
  ipcRenderer.on('bs-hide',   () => { const p=$('possample'); if(p) p.style.display='none'; try { cleanupRoulette(); } catch(e){} });
  // Borra CUALQUIER ruleta que haya quedado en el DOM (el auto-cierre por timeout no la quitaba)
  // y detiene su audio, para que la siguiente Blue Shell no se dibuje encima de la anterior.
  let curAudio = null;
  function cleanupRoulette(){
    document.querySelectorAll('.sqcr-overlay').forEach(el => el.remove());
    $('notif').style.display = 'none';
    if (curAudio){ try { curAudio.pause(); } catch(e){} curAudio = null; }
  }
  const done = () => { cleanupRoulette(); setChrome(false); ipcRenderer.send('bs-done'); };

  // Escala la ruleta para que ocupe la ventana (mantiene proporción y queda centrada).
  function fitBox(){
    const box = document.querySelector('.sqcr-box'); if (!box) return;
    box.style.transform = 'none';                      // resetea para medir el tamaño natural
    const bw = box.offsetWidth || 520, bh = box.offsetHeight || 130;
    const s = Math.min(window.innerWidth / (bw + 16), window.innerHeight / (bh + 16));
    box.style.transformOrigin = 'center center';
    box.style.transform = 'scale(' + Math.max(0.2, Math.min(2.5, s)) + ')';
  }
  window.addEventListener('resize', fitBox);

  // ---- Mover: se arrastra la propia ruleta (sin barra). Distingue click (cerrar) de arrastre (mover). ----
  let dg = null;              // { sx, sy, moved } mientras se arrastra
  let rz = null;             // { x, y, w, h } mientras se redimensiona
  let swallowClick = false;  // si venías arrastrando, no dejes que el click cierre la ruleta
  document.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('#grip')) return;         // el grip maneja su propio resize
    if (!e.target.closest('.sqcr-box')) return;    // fuera de la ruleta: deja pasar (cerrar)
    dg = { sx:e.screenX, sy:e.screenY, moved:false };
    ipcRenderer.send('drag-start', { mx:e.screenX, my:e.screenY });
  });
  // ---- Redimensionar (grip esquina) ----
  $('grip').addEventListener('mousedown', e => { rz = { x:e.screenX, y:e.screenY, w:window.innerWidth, h:window.innerHeight }; e.preventDefault(); e.stopPropagation(); });
  window.addEventListener('mousemove', e => {
    if (dg){
      if (!dg.moved && Math.abs(e.screenX - dg.sx) + Math.abs(e.screenY - dg.sy) > 4) dg.moved = true;
      if (dg.moved) ipcRenderer.send('drag-move', { mx:e.screenX, my:e.screenY });
    } else if (rz){
      ipcRenderer.send('bs-resize', { w: rz.w + (e.screenX - rz.x), h: rz.h + (e.screenY - rz.y) });
    }
  });
  window.addEventListener('mouseup', () => {
    if (dg){ ipcRenderer.send('drag-end'); if (dg.moved){ swallowClick = true; setTimeout(() => { swallowClick = false; }, 60); } dg = null; }
    if (rz){ rz = null; ipcRenderer.send('bs-resize-end'); }
  });
  // Bloquea el click de cierre si el mouseup venía de un arrastre (fase de captura, antes que el overlay).
  window.addEventListener('click', e => { if (swallowClick){ swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

  ipcRenderer.on('bs-event', (_e, ev) => {
    cleanupRoulette();   // borra cualquier ruleta/notif anterior que haya quedado
    setChrome(false);
    const from = ev.from || 'Alguien', castigo = ev.castigo || 'Reverse';
    const audio = new Audio(AUDIO); audio.preload = 'auto'; curAudio = audio;
    audio.volume = (ev.volume != null) ? Math.max(0, Math.min(1, ev.volume)) : 0.8;
    if (ev.mode === 'roulette'){
      // Fuera de partida: precarga TODO (círculo de carga) y arranca audio+ruleta juntos.
      SQCRoulette.loading(true);
      Promise.all([ SQCRoulette.waitAudio(audio), SQCRoulette.preloadImages(IMG) ]).then(() => {
        SQCRoulette.loading(false);
        try { audio.currentTime = 0; audio.play().catch(()=>{}); } catch(e){}
        SQCRoulette.show({ castigo, imgBase: IMG, audioUrl: AUDIO, audio, champIcon: ev.champIcon, champName: ev.champ,
          title: '🛡 Te lanzaron una Blue Shell', subtitle: from + ' → tú', onDone: done });
        setChrome(true);
        // Re-escala en varios momentos (el layout/imagenes tardan un frame) para que no salga cortada.
        [0, 120, 300, 700].forEach(t => setTimeout(fitBox, t));
        document.querySelectorAll('.sqcr-box img').forEach(img => { if (!img.complete) img.addEventListener('load', fitBox, { once: true }); });
        setTimeout(done, 9000);   // auto-cierre de respaldo
      });
    } else {
      // En partida: notificación pequeña en la esquina (sin ruleta, sin mover/resize).
      SQCRoulette.waitAudio(audio).then(() => {
        try { audio.currentTime = 0; audio.play().catch(()=>{}); } catch(e){}
        setTimeout(() => {
          $('ni').src = IMG + (SLUG[castigo] || 'reverse') + '.png';
          $('nt').innerHTML = '🛡 <b>' + from + '</b> te lanzó una Blue Shell';
          $('nc').textContent = castigo + (ev.champ ? ' — ' + ev.champ : '');
          $('notif').style.display = 'flex';
        }, 4140);
        setTimeout(done, 4140 + 7000);   // se cierra sola ~7s después de aparecer
      });
    }
  });
</script>
</body>
</html>
