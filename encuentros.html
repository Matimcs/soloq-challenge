<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoloQ Challenge — Encuentros</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
  :root{
    --bg:#0b0b0b; --panel:#0b0c10; --panel-2:#121319; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#fff; --muted:rgba(255,255,255,.55); --muted-2:rgba(255,255,255,.38);
    --accent:#e9ff1f; --up:#34d399; --down:#fb7185; --gold:#ffd24a; --blue:#4aa3ff; --purple:#c084fc;
    --font:'General Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:radial-gradient(1100px 550px at 50% -200px, rgba(233,255,31,.05), transparent 60%), var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 20px; }
  .brand b span{ color:var(--accent); }

  h1{ font-size:30px; letter-spacing:-.02em; margin:26px 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:22px; }

  .enc{ display:flex; flex-direction:column; gap:12px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .tag{ font-size:10px; font-weight:800; letter-spacing:.06em; padding:4px 9px; border-radius:6px; flex-shrink:0; }
  .tag.rival{ background:rgba(251,113,133,.14); color:var(--down); border:1px solid rgba(251,113,133,.4); }
  .tag.ally{ background:rgba(52,211,153,.14); color:var(--up); border:1px solid rgba(52,211,153,.4); }
  .enc-filters{ display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
  .enc-filters .chip{ font-family:inherit; cursor:pointer; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:7px 14px; font-size:12px; font-weight:800; letter-spacing:.04em; }
  .enc-filters .chip:hover{ color:#fff; }
  .enc-filters .chip.active{ background:#fff; color:#000; border-color:#fff; }
  .sides{ display:flex; align-items:center; gap:12px; flex:1; min-width:220px; flex-wrap:wrap; }
  .side{ display:flex; align-items:center; gap:9px; }
  .pl{ display:flex; align-items:center; gap:8px; }
  .pl img{ width:34px; height:34px; border-radius:9px; object-fit:cover; background:var(--panel-2); border:1px solid var(--line); }
  .pl .nm{ font-size:14px; font-weight:700; }
  .pl .res{ font-size:11px; font-weight:800; }
  .pl .res.w{ color:var(--up); } .pl .res.l{ color:var(--down); }
  .vs{ font-size:12px; font-weight:800; color:var(--muted-2); }
  .meta{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-shrink:0; }
  .date{ font-size:11px; color:var(--muted-2); white-space:nowrap; }
  .go{ font-size:12px; font-weight:700; color:#000; background:var(--accent); padding:7px 13px; border-radius:8px; white-space:nowrap; }
  .go:hover{ filter:brightness(1.05); }
  .opgg{ font-size:11px; font-weight:700; color:var(--blue); border:1px solid rgba(74,163,255,.4); padding:6px 10px; border-radius:8px; }
  .empty{ color:var(--muted); font-size:14px; text-align:center; padding:50px 0; }
  .note{ font-size:11px; color:var(--muted-2); text-align:center; margin:24px 0 40px; }
  /* encuentros nuevos desde la última visita */
  .card.new{ box-shadow:0 0 0 1px var(--accent), 0 0 22px rgba(233,255,31,.12); border-color:transparent; }
  .enc-new{ font-size:9.5px; font-weight:800; letter-spacing:.08em; color:#000; background:var(--accent); padding:3px 8px; border-radius:6px; flex-shrink:0; }
  #enc-stack{ position:fixed; right:18px; bottom:18px; z-index:9999; display:flex; flex-direction:column-reverse; gap:10px; }
  .enc-toast{ width:320px; max-width:calc(100vw - 32px); background:linear-gradient(180deg,#111318,#0c0d11); border:1px solid rgba(255,255,255,.09);
    border-radius:14px; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.55); animation:encIn .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes encIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none; } }
  .et-head{ display:flex; align-items:center; gap:9px; padding:12px 14px; }
  .et-ico{ font-size:18px; }
  .et-txt{ flex:1; font-size:13px; font-weight:700; }
  .et-txt small{ display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:2px; }
  .et-x{ background:none; border:0; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 4px; }
  .et-x:hover{ color:#fff; }
</style>
<link rel="stylesheet" href="nav.css">
<link rel="icon" type="image/png" href="overlay/assets/logo.png">
</head>
<body>
  <header><div class="wrap nav">
    <div class="nav-left">
      <a class="brand" href="index.html"><img src="overlay/assets/logo.png" alt="SoloQ Challenge"></a>
    </div>
    <nav class="nav-pill">
      <a href="index.html">Ranking</a>
      <a href="index.html#live">Live Games <span class="nav-badge" id="nav-live-count" style="display:none">0</span></a>
      <a href="encuentros.html" class="active">Encuentros <span class="nav-badge" id="nav-enc-count" style="display:none">0</span></a>
      <a href="estadisticas.html">Estadísticas</a>
      <a href="torneos.html">Torneos</a>
      <a href="blueshell.html" id="nav-blueshell" style="display:none">Blue Shells</a>
      <a href="ticket.html" id="nav-ticket" style="display:none">Tickets</a>
      <a href="admin.html" id="nav-admin" style="display:none">Admin</a>
    </nav>
    <div class="nav-right">
      <a class="login-pill" href="cuenta.html" id="nav-account">Iniciar sesión</a>
      <button class="logout-link" id="logout" style="display:none">Salir</button>
    </div>
  </div></header>

  <main class="wrap">
    <h1>Encuentros</h1>
    <div class="sub">Partidas donde coincidieron dos o más jugadores del torneo — como aliados o como rivales.</div>
    <div class="enc-filters" id="enc-filters">
      <button class="chip active" data-f="all">TODOS</button>
      <button class="chip" data-f="ally">🤝 Aliados</button>
      <button class="chip" data-f="rival">⚔ Rivales</button>
    </div>
    <div class="enc" id="enc"></div>
    <div class="note">Se detectan cruzando el historial reciente de cada jugador (últimas ~15 partidas). Actualiza solo.</div>
  </main>

<script src="players.js"></script>
<script src="api.js"></script>
<script>
  const FIXCHAMP = { FiddleSticks:'Fiddlesticks' };
  let DDV = (window.SQC_DATA && window.SQC_DATA.ddragonVersion) || '16.15.1';
  const champUrl = c => c ? `https://ddragon.leagueoflegends.com/cdn/${DDV}/img/champion/${FIXCHAMP[c]||c}.png` : '';
  const opgg = rid => { const [n,t] = rid.split('#'); return `https://op.gg/summoners/las/${encodeURIComponent(n)}-${encodeURIComponent(t||'')}`; };
  const logUrl = id => { const num = String(id).split('_')[1] || id; return `https://www.leagueofgraphs.com/match/las/${num}`; };
  const fdate = ms => ms ? new Date(ms).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

  function plHtml(p){
    const res = p.win ? '<span class="res w">Ganó</span>' : '<span class="res l">Perdió</span>';
    return `<a class="pl" href="${opgg(p.rid)}" target="_blank" rel="noopener" title="op.gg de ${p.nm}">
      <img src="${champUrl(p.champ)}" onerror="this.style.visibility='hidden'">
      <span><span class="nm">${p.nm}</span> ${res}</span></a>`;
  }

  // "Visto" por usuario (localStorage): marca de tiempo del encuentro más reciente ya visto.
  // Robusto ante deploys/cambios de datos (no depende de IDs). Nuevo = end > lastSeen.
  const SEEN_KEY = 'sqc_enc_lastseen';
  const lastSeenAtLoad = (() => { try { return Number(localStorage.getItem(SEEN_KEY) || 0) || 0; } catch { return 0; } })();
  function markSeen(maxEnd){ try { const cur = Number(localStorage.getItem(SEEN_KEY) || 0) || 0; if (maxEnd > cur) localStorage.setItem(SEEN_KEY, String(maxEnd)); } catch {} }
  let encToastShown = false;
  function showEncToast(n){
    let stack = document.getElementById('enc-stack');
    if (!stack){ stack = document.createElement('div'); stack.id = 'enc-stack'; document.body.appendChild(stack); }
    const el = document.createElement('div'); el.className = 'enc-toast';
    el.innerHTML = `<div class="et-head"><span class="et-ico">🤝</span>
      <div class="et-txt">${n} ${n===1?'encuentro nuevo':'encuentros nuevos'}<small>Ocurrieron desde tu última visita</small></div>
      <button class="et-x" title="Cerrar">✕</button></div>`;
    el.querySelector('.et-x').addEventListener('click', () => el.remove());
    stack.appendChild(el);
    setTimeout(() => el.remove(), 9000);
  }

  function card(e, isNew){
    const players = e.players || [];
    const winners = players.filter(p=>p.win), losers = players.filter(p=>!p.win);
    const rivals = winners.length && losers.length;
    let sides;
    if (rivals){
      sides = `<div class="side">${winners.map(plHtml).join('')}</div><span class="vs">VS</span><div class="side">${losers.map(plHtml).join('')}</div>`;
    } else {
      sides = `<div class="side">${players.map(plHtml).join('')}</div>`;
    }
    const tag = rivals ? '<span class="tag rival">⚔ Rivales</span>' : '<span class="tag ally">🤝 Aliados</span>';
    return `<div class="card${isNew?' new':''}">
      ${isNew?'<span class="enc-new">NUEVO</span>':''}${tag}
      <div class="sides">${sides}</div>
      <div class="meta">
        <span class="date">${fdate(e.end)}</span>
        <a class="go" href="${logUrl(e.id)}" target="_blank" rel="noopener">Ver partida</a>
      </div>
    </div>`;
  }

  // Un encuentro es "rivales" si hubo participantes en ambos bandos (unos ganaron, otros perdieron);
  // si no, fueron "aliados" (mismo equipo).
  const isRival = e => { const ps = e.players || []; return ps.some(p => p.win) && ps.some(p => !p.win); };
  let ENC_LIST = [], encFilter = 'all';
  function paint(){
    const el = document.getElementById('enc');
    const list = ENC_LIST.filter(e => encFilter === 'all' ? true : encFilter === 'ally' ? !isRival(e) : isRival(e));
    el.innerHTML = list.length ? list.map(e => card(e, (e.end || 0) > lastSeenAtLoad)).join('')
      : `<div class="empty">${ENC_LIST.length ? 'No hay encuentros en esta categoría.' : 'Aún no hay encuentros registrados. Aparecerán cuando dos jugadores del torneo coincidan en una partida.'}</div>`;
  }
  function render(data){
    DDV = (data && data.ddragonVersion) || DDV;
    ENC_LIST = (data && Array.isArray(data.encounters)) ? data.encounters : [];
    paint();
    // Avisa (una vez por sesión) de los encuentros ocurridos en tu ausencia, y márcalos vistos.
    const nuevos = ENC_LIST.filter(e => (e.end || 0) > lastSeenAtLoad).length;
    if (nuevos && !encToastShown){ encToastShown = true; showEncToast(nuevos); }
    if (ENC_LIST.length){ markSeen(Math.max(...ENC_LIST.map(e => e.end || 0))); if (window.SQC) SQC.navBadges(); }
  }
  document.querySelectorAll('#enc-filters .chip').forEach(b => b.onclick = () => {
    document.querySelectorAll('#enc-filters .chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); encFilter = b.dataset.f; paint();
  });

  // Los encuentros ahora salen de /api/encounters (reconstruido del historial COMPLETO
  // en la DB, con equipo y resultado reales) → detecta aliados Y rivales, no solo dúos.
  // Se pinta primero el snapshot cacheado para no ver vacío, y luego se refresca del API.
  async function loadEnc(){
    try { const r = await fetch('/api/encounters', { cache:'no-store' }); if (!r.ok) return;
      const d = await r.json(); render({ encounters: d.encounters || [], ddragonVersion: DDV }); } catch {}
  }
  render(window.SQC_DATA || null);
  SQC.preNav(); SQC.mountNav();
  if (location.protocol.startsWith('http')){
    loadEnc();
    setInterval(loadEnc, 30000);
  }
</script>
</body>
</html>
