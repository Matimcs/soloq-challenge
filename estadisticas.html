<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoloQ Challenge — Estadísticas</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
  :root{
    --bg:#0b0b0b; --panel:#0b0c10; --panel-2:#121319; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#fff; --muted:rgba(255,255,255,.55); --muted-2:rgba(255,255,255,.38);
    --accent:#e9ff1f; --up:#34d399; --down:#fb7185; --gold:#ffd24a; --blue:#4aa3ff; --purple:#c084fc;
    --font:'General Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:radial-gradient(1100px 550px at 50% -200px, rgba(233,255,31,.05), transparent 60%), var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }
  main.wrap{ padding-bottom:64px; }   /* aire al final de la página */
  .brand b span{ color:var(--accent); }
  h1{ font-size:30px; letter-spacing:-.02em; margin:26px 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:20px; }

  /* Tabs */
  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .tab{ background:none; border:0; color:var(--muted); font-family:inherit; font-size:13px; font-weight:800; letter-spacing:.06em;
    padding:11px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover{ color:#fff; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .panel{ display:none; } .panel.active{ display:block; }

  /* Cards */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card h3{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--accent); }
  .card .cap{ font-size:11px; color:var(--muted-2); margin:2px 0 12px; }
  .rowl{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .rowl:first-of-type{ border-top:0; }
  .rk{ width:20px; text-align:center; font-size:13px; font-weight:800; color:var(--muted); flex-shrink:0; }
  .rk.t1{ color:var(--gold); } .rk.t2{ color:#d7dde3; } .rk.t3{ color:#e0a878; }
  .nm{ font-size:14px; font-weight:700; }
  .elo-tag{ font-size:9px; font-weight:800; letter-spacing:.04em; padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:middle; }
  .elo-tag.high{ color:var(--accent); background:rgba(233,255,31,.12); border:1px solid rgba(233,255,31,.35); }
  .elo-tag.low{ color:var(--blue); background:rgba(74,163,255,.12); border:1px solid rgba(74,163,255,.35); }
  .games{ font-size:11px; color:var(--muted-2); }
  .val{ margin-left:auto; font-size:16px; font-weight:800; color:#fff; }
  .meta{ display:flex; flex-direction:column; min-width:0; }

  /* ELO: subidones/bajones */
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:640px){ .two{ grid-template-columns:1fr; } }
  .day{ font-size:11px; color:var(--muted-2); }
  .net{ margin-left:auto; font-size:15px; font-weight:800; }
  .net.up{ color:var(--up); } .net.down{ color:var(--down); }

  /* Chart */
  .chartwrap{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
  .chartwrap h3{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--accent); }
  .chartwrap .cap{ font-size:11px; color:var(--muted-2); margin:2px 0 10px; }
  #elo-svg{ width:100%; height:380px; display:block; }
  /* Chart de elo promedio con hover interactivo */
  .avg-chart{ position:relative; }
  .avg-chart svg{ width:100%; display:block; cursor:crosshair; }
  .avg-guide{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.28); pointer-events:none; display:none; transform:translateX(-.5px); }
  .avg-dot{ position:absolute; width:10px; height:10px; border-radius:50%; background:var(--accent); border:1.5px solid #000; pointer-events:none; display:none; transform:translate(-50%,-50%); box-shadow:0 0 8px rgba(233,255,31,.6); }
  .avg-tip{ position:absolute; pointer-events:none; background:rgba(12,13,17,.96); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; font-weight:700; color:#fff; text-align:center; transform:translate(-50%,calc(-100% - 10px)); white-space:nowrap; z-index:5; display:none; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .avg-tip .d{ color:var(--muted); font-size:10px; font-weight:600; }
  .avg-tip b{ color:var(--accent); }
  .avg-date{ position:absolute; bottom:3px; pointer-events:none; transform:translateX(-50%); font-size:10px; font-weight:800; color:#000; background:var(--accent); padding:1px 6px; border-radius:4px; display:none; white-space:nowrap; }
  /* Evolución de elo: hover para identificar la línea */
  .elo-chart{ position:relative; }
  .elo-chart svg{ cursor:crosshair; }
  .eline{ transition:stroke-width .08s, opacity .08s; }
  .elo-dot{ position:absolute; width:11px; height:11px; border-radius:50%; border:2px solid #000; pointer-events:none; display:none; transform:translate(-50%,-50%); box-shadow:0 0 8px rgba(0,0,0,.6); }
  .elo-tip{ position:absolute; pointer-events:none; background:rgba(12,13,17,.97); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; font-weight:700; color:#fff; white-space:nowrap; z-index:6; display:none; transform:translate(-50%,calc(-100% - 12px)); box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .elo-tip .d{ color:var(--muted); font-size:10px; font-weight:600; margin-top:2px; }
  .elo-tip .nmc{ display:inline-flex; align-items:center; gap:6px; }
  .elo-tip .sw{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .legend{ display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:12px; }
  .lg{ font-size:11px; color:var(--muted); cursor:pointer; padding:2px 7px; border-radius:6px; border:1px solid var(--line); user-select:none; }
  .lg .dot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .lg.off{ opacity:.35; text-decoration:line-through; }
  .elo-range-row{ display:flex; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
  .elo-range-row .rlbl{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.04em; }
  .elo-range-row input[type=range]{ flex:0 1 220px; accent-color:var(--accent); cursor:pointer; }
  .elo-range-row .cap{ margin:0; }
  .legend-tools{ display:flex; gap:8px; margin-top:12px; }
  .lgt{ font-family:inherit; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:rgba(255,255,255,.04); }
  .lgt:hover{ color:#fff; border-color:var(--line-2); }

  /* Coincidencias */
  .kpi{ font-size:12px; color:var(--muted); margin-bottom:16px; }
  .kpi b{ color:var(--accent); font-size:15px; }
  .duel{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .duel:first-of-type{ border-top:0; }
  .duel .score{ font-weight:800; color:#fff; }
  .duel .tg{ margin-left:auto; font-size:11px; color:var(--muted-2); }
  .enc{ display:flex; flex-direction:column; gap:10px; }
  .encc{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .encc .tag{ font-size:10px; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:6px; flex-shrink:0; }
  .encc .tag.rival{ background:rgba(251,113,133,.14); color:var(--down); border:1px solid rgba(251,113,133,.4); }
  .encc .tag.ally{ background:rgba(52,211,153,.14); color:var(--up); border:1px solid rgba(52,211,153,.4); }
  .encc .side{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .encc .p{ font-size:13px; font-weight:700; } .encc .p .res{ font-size:10px; font-weight:800; margin-left:4px; }
  .encc .p .res.w{ color:var(--up); } .encc .p .res.l{ color:var(--down); }
  .encc .vs{ font-size:11px; font-weight:800; color:var(--muted-2); }
  .encc .date{ margin-left:auto; font-size:11px; color:var(--muted-2); }
  .empty{ color:var(--muted); font-size:14px; text-align:center; padding:40px 0; }
  .loading{ color:var(--muted); font-size:14px; text-align:center; padding:60px 0; }
  .subh{ font-size:15px; font-weight:700; margin:26px 0 12px; }
</style>

    <div class="tabs">

<script>
  let DATA = null;
  const $ = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const eloTag = high => `<span class="elo-tag ${high?'high':'low'}">${high?'HIGH ELO':'LOW ELO'}</span>`;
  const fdate = ms => ms ? new Date(ms).toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  const fday  = s => { try { const [y,m,d]=s.split('-'); return new Date(y,m-1,d).toLocaleDateString('es-CL',{day:'2-digit',month:'short'}); } catch { return s; } }

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    $('p-'+b.dataset.t).classList.add('active');
    if (b.dataset.t==='elo' && DATA){ drawChart(); drawAvgChart(); }
  });

  // ---- TOPS ----
  function topCard(title, cap, list, fmt){
    const rows = (list||[]).map((p,i) => `
      <div class="rowl">
        <div class="rk ${i<3?('t'+(i+1)):''}">${i+1}</div>
        <div class="meta"><div class="nm">${esc(p.nm)}${eloTag(p.high)}</div><div class="games">${p.games} partidas</div></div>
        <div class="val">${fmt(p.value)}</div>
      </div>`).join('');
    return `<div class="card"><h3>${title}</h3><div class="cap">${cap}</div>${rows||'<div class="empty">Sin datos</div>'}</div>`;
  }
  function renderTops(){
    const t = DATA.tops;
    const avg1 = v => (Math.round(v*10)/10).toFixed(1);
    const dec = v => (Math.round(v*100)/100).toFixed(2);
    const int0 = v => Math.round(v).toLocaleString('es-CL');
    $('p-tops').innerHTML = `<div class="grid">
      ${topCard('KILLS','Promedio de asesinatos por partida (mín. 10)', t.kills, avg1)}
      ${topCard('MUERTES','Promedio de muertes por partida (mín. 10)', t.deaths, avg1)}
      ${topCard('ASISTENCIAS','Promedio de asistencias por partida (mín. 10)', t.assists, avg1)}
      ${topCard('CS / MIN','Farmeo por minuto — sin support (mín. 10 partidas)', t.csmin, dec)}
      ${topCard('ORO / MIN','Oro por minuto (mín. 10 partidas)', t.goldmin, int0)}
      ${topCard('KDA','(Kills + Asistencias) / Muertes (mín. 10 partidas)', t.kda, dec)}
    </div>`;
  }

  // ---- ELO ----
  function renderElo(){
    const e = DATA.elo;
    const col = (title, arr, cls, sign) => `<div class="card"><h3>${title}</h3><div class="cap">Diferencia de elo respecto al día anterior</div>${
      (arr||[]).map((d,i) => `<div class="rowl">
        <div class="rk ${i<3?('t'+(i+1)):''}">${i+1}</div>
        <div class="meta"><div class="nm">${esc(d.nm)}${eloTag(d.high)}</div><div class="day">${fday(d.day)}</div></div>
        <div class="net ${cls}">${sign}${Math.abs(d.net)}</div>
      </div>`).join('') || '<div class="empty">Sin datos</div>'}</div>`;
    $('p-elo').innerHTML = `
      <div class="subh">Mejores días — quién más elo ganó (o perdió) en un solo día</div>
      <div class="two">${col('SUBIDONES', e.subidones, 'up', '+')}${col('BAJONES', e.bajones, 'down', '−')}</div>
      <div class="chartwrap">
        <h3>EVOLUCIÓN DE ELO</h3><div class="cap">Reconstruida desde el historial de partidas (LP exacto donde se capturó, estimado por V/D si no) · pasa el mouse sobre una línea para ver quién es · clic en un nombre para ocultarlo</div>
        <div class="elo-range-row">
          <span class="rlbl">Rango:</span>
          <input type="range" id="elo-range" min="7" max="30" value="30">
          <span id="elo-range-lbl" class="cap"></span>
        </div>
        <div class="elo-chart" id="elo-chart">
          <svg id="elo-svg" viewBox="0 0 1000 380" preserveAspectRatio="none"></svg>
          <div class="elo-dot" id="elo-dot"></div>
          <div class="elo-tip" id="elo-tip"></div>
        </div>
        <div class="legend-tools">
          <button class="lgt" id="elo-hide-all">Desmarcar todas</button>
          <button class="lgt" id="elo-show-all">Marcar todas</button>
        </div>
        <div class="legend" id="elo-legend"></div>
      </div>
      <div class="chartwrap">
        <h3>ELO PROMEDIO DEL RANKING</h3><div class="cap" id="avg-cap">Promedio del elo de todos los jugadores a lo largo del tiempo</div>
        <div class="avg-chart" id="avg-chart">
          <svg id="avg-svg" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
          <div class="avg-guide" id="avg-guide"></div>
          <div class="avg-dot" id="avg-dot"></div>
          <div class="avg-tip" id="avg-tip"></div>
          <div class="avg-date" id="avg-date"></div>
        </div>
      </div>`;
    drawChart(); drawAvgChart();
    $('elo-hide-all').onclick = () => { (DATA.elo.series||[]).forEach(s=>hidden.add(s.rid)); drawChart(); };
    $('elo-show-all').onclick = () => { hidden.clear(); drawChart(); };
  }
  function eloTierLabel(abs){
    abs = Math.round(abs);
    if (abs >= 2800) return 'Master ' + (abs-2800) + ' LP';
    const TN=['Iron','Bronze','Silver','Gold','Plat','Emerald','Diamond'], DN=['IV','III','II','I'];
    const ti=Math.min(6,Math.floor(abs/400)), rem=abs-ti*400, di=Math.min(3,Math.floor(rem/100));
    return TN[ti]+' '+DN[di]+' '+(rem-di*100)+' LP';
  }
  function drawAvgChart(){
    const svg = $('avg-svg'); if (!svg || !DATA) return;
    const pts = (DATA.elo.avgSeries||[]).filter(p => p.lp!=null);
    if (pts.length < 2){ svg.innerHTML=''; return; }
    const W=1000,H=300,PL=40,PR=12,PT=12,PB=22;
    let tMin=Infinity,tMax=-Infinity,yMin=Infinity,yMax=-Infinity;
    pts.forEach(p=>{ tMin=Math.min(tMin,p.t); tMax=Math.max(tMax,p.t); yMin=Math.min(yMin,p.lp); yMax=Math.max(yMax,p.lp); });
    yMin=Math.max(0,yMin-80); yMax+=80;
    const X=t=>PL+(tMax===tMin?0:(t-tMin)/(tMax-tMin))*(W-PL-PR);
    const Y=v=>PT+(1-(v-yMin)/((yMax-yMin)||1))*(H-PT-PB);
    const ticks=[{v:0,l:'I4'},{v:400,l:'B'},{v:800,l:'S'},{v:1200,l:'G'},{v:1600,l:'P'},{v:2000,l:'E'},{v:2400,l:'D'},{v:2800,l:'M+'}];
    const g=ticks.filter(k=>k.v>=yMin&&k.v<=yMax).map(k=>`<line x1="${PL}" y1="${Y(k.v).toFixed(1)}" x2="${W-PR}" y2="${Y(k.v).toFixed(1)}" stroke="rgba(255,255,255,.06)"/><text x="4" y="${(Y(k.v)+3).toFixed(1)}" fill="rgba(255,255,255,.38)" font-size="10">${k.l}</text>`).join('');
    const line=pts.map((p,j)=>(j?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.lp).toFixed(1)).join(' ');
    const area=`M${X(pts[0].t).toFixed(1)} ${Y(yMin).toFixed(1)} `+pts.map(p=>'L'+X(p.t).toFixed(1)+' '+Y(p.lp).toFixed(1)).join(' ')+` L${X(pts[pts.length-1].t).toFixed(1)} ${Y(yMin).toFixed(1)} Z`;
    svg.innerHTML = g + `<path d="${area}" fill="rgba(233,255,31,.08)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    const last = pts[pts.length-1];
    const cap = $('avg-cap'); if (cap) cap.textContent = `Promedio actual: ${eloTierLabel(last.lp)} · ${last.n} jugadores · pasa el mouse para ver por fecha`;
    // Datos para el hover interactivo.
    const box = $('avg-chart');
    if (box){
      box._avg = { pts, W, H, PL, PR, X, Y, tMin, tMax };
      if (!box._hoverBound){ box._hoverBound = true;
        box.addEventListener('mousemove', avgHover);
        box.addEventListener('mouseleave', avgHideHover);
      }
    }
  }
  function avgHideHover(){ ['avg-guide','avg-dot','avg-tip','avg-date'].forEach(id=>{ const el=$(id); if(el) el.style.display='none'; }); }
  function avgHover(e){
    const box=$('avg-chart'), d=box&&box._avg; if(!d) return;
    const svg=$('avg-svg'), rect=svg.getBoundingClientRect(); if(!rect.width) return;
    const vbX=(e.clientX-rect.left)/rect.width*d.W;
    const span=(d.W-d.PL-d.PR)||1, frac=Math.max(0,Math.min(1,(vbX-d.PL)/span));
    const t=d.tMin+frac*(d.tMax-d.tMin);
    let best=d.pts[0],bd=Infinity; for(const p of d.pts){ const dd=Math.abs(p.t-t); if(dd<bd){bd=dd;best=p;} }
    const px=d.X(best.t)/d.W*rect.width, py=d.Y(best.lp)/d.H*rect.height;
    const dstr=new Date(best.t).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
    const dot=$('avg-dot'), guide=$('avg-guide'), tip=$('avg-tip'), dl=$('avg-date');
    if(guide){ guide.style.display='block'; guide.style.left=px+'px'; }
    if(dot){ dot.style.display='block'; dot.style.left=px+'px'; dot.style.top=py+'px'; }
    if(tip){ tip.style.display='block'; tip.style.left=px+'px'; tip.style.top=py+'px';
      tip.style.transform = py>80 ? 'translate(-50%,calc(-100% - 12px))' : 'translate(-50%,12px)';
      tip.innerHTML=`<div class="d">${dstr}</div><b>${eloTierLabel(best.lp)}</b><div class="d">${best.n} jugadores</div>`; }
    if(dl){ dl.style.display='block'; dl.style.left=px+'px'; dl.textContent=dstr; }
  }
  const hidden = new Set();
  const PALETTE = ['#e9ff1f','#4aa3ff','#fb7185','#34d399','#c084fc','#ffd24a','#f472b6','#22d3ee','#a3e635','#fb923c','#818cf8','#f87171'];
  const DAY = 86400000;
  let eloDays = 30;   // ventana visible (por defecto, último mes)
  // Recorta los puntos a [tMin,tMax], interpolando el borde izquierdo para que la línea llene el ancho.
  function clipPoints(pts, tMin, tMax){
    const out=[];
    for (let i=0;i<pts.length;i++){ const p=pts[i];
      if (p.t < tMin) continue;
      if (p.t > tMax) break;
      if (out.length===0 && i>0){ const a=pts[i-1]; if (a.t<tMin){ const f=(tMin-a.t)/((p.t-a.t)||1); out.push({ t:tMin, lp:a.lp+(p.lp-a.lp)*f }); } }
      out.push(p);
    }
    return out;
  }
  function drawChart(){
    const svg = $('elo-svg'); if (!svg || !DATA) return;
    const all = (DATA.elo.series||[]).filter(s => s.points && s.points.length>=2);
    if (!all.length){ svg.innerHTML=''; $('elo-legend').innerHTML='<div class="empty">Sin datos de evolución</div>'; return; }
    const W=1000, H=380, PL=40, PR=12, PT=12, PB=22;
    // Rango temporal completo del historial.
    let fullMin=Infinity, fullMax=-Infinity;
    all.forEach(s => s.points.forEach(p => { if (p.t<fullMin) fullMin=p.t; if (p.t>fullMax) fullMax=p.t; }));
    const totalDays = Math.max(1, Math.ceil((fullMax-fullMin)/DAY));
    // Slider: min 7 días, max = historial completo, por defecto 30 (o menos si hay menos).
    const rng = $('elo-range');
    if (rng){ rng.min=7; rng.max=totalDays; if (!rng._init || +rng.value>totalDays){ rng.value=Math.min(eloDays,totalDays); rng._init=true; } eloDays=+rng.value; }
    else eloDays=Math.min(eloDays,totalDays);
    // Ventana visible.
    const tMax=fullMax, tMin=Math.max(fullMin, tMax-eloDays*DAY);
    const series = all.map(s => ({ rid:s.rid, nm:s.nm, high:s.high, pts:clipPoints(s.points, tMin, tMax) }));
    // Rango Y de lo visible en la ventana.
    let yMin=Infinity,yMax=-Infinity;
    series.forEach(s => { if (hidden.has(s.rid)) return; s.pts.forEach(p => { if (p.lp<yMin) yMin=p.lp; if (p.lp>yMax) yMax=p.lp; }); });
    if (yMin===Infinity){ yMin=0; yMax=100; }
    yMin=Math.max(0,yMin-100); yMax+=100;
    const X = t => PL + (tMax===tMin?0:(t-tMin)/(tMax-tMin))*(W-PL-PR);
    const Y = v => PT + (1-(v-yMin)/((yMax-yMin)||1))*(H-PT-PB);
    const ticks=[{v:0,l:'I4'},{v:400,l:'B'},{v:800,l:'S'},{v:1200,l:'G'},{v:1600,l:'P'},{v:2000,l:'E'},{v:2400,l:'D'},{v:2800,l:'M+'}];
    let g = ticks.filter(k=>k.v>=yMin&&k.v<=yMax).map(k =>
      `<line x1="${PL}" y1="${Y(k.v).toFixed(1)}" x2="${W-PR}" y2="${Y(k.v).toFixed(1)}" stroke="rgba(255,255,255,.06)"/>`+
      `<text x="4" y="${(Y(k.v)+3).toFixed(1)}" fill="rgba(255,255,255,.38)" font-size="10">${k.l}</text>`).join('');
    let paths = series.map((s,i) => {
      if (hidden.has(s.rid) || s.pts.length<2) return '';
      const c = PALETTE[i%PALETTE.length];
      const d = s.pts.map((p,j) => (j?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.lp).toFixed(1)).join(' ');
      return `<path class="eline" data-i="${i}" d="${d}" fill="none" stroke="${c}" stroke-width="1.5" opacity=".9"/>`;
    }).join('');
    svg.innerHTML = g + paths;
    $('elo-legend').innerHTML = series.map((s,i) =>
      `<span class="lg ${hidden.has(s.rid)?'off':''}" data-rid="${esc(s.rid)}"><span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(s.nm)}</span>`).join('');
    $('elo-legend').querySelectorAll('.lg').forEach(el => el.onclick = () => {
      const r = el.dataset.rid; hidden.has(r)?hidden.delete(r):hidden.add(r); drawChart();
    });
    // Etiqueta del rango.
    const lbl = $('elo-range-lbl'), fmt = t => new Date(t).toLocaleDateString('es-CL',{day:'2-digit',month:'short'});
    if (lbl) lbl.textContent = (eloDays>=totalDays) ? `Todo el historial (${fmt(tMin)} → hoy)` : `Últimos ${eloDays} días (desde ${fmt(tMin)})`;
    // Datos para el hover (identificar la línea).
    const box = $('elo-chart');
    if (box){
      box._elo = { series, W, H, X, Y, tMin, tMax };
      if (!box._hoverBound){ box._hoverBound = true;
        box.addEventListener('mousemove', eloHover);
        box.addEventListener('mouseleave', eloHideHover);
      }
      if (rng && !rng._bound){ rng._bound=true; rng.oninput = drawChart; }
    }
  }
  function eloHideHover(){
    const t=$('elo-tip'), d=$('elo-dot'); if(t)t.style.display='none'; if(d)d.style.display='none';
    document.querySelectorAll('#elo-svg .eline').forEach(p=>{ p.style.strokeWidth='1.5'; p.style.opacity='.9'; });
  }
  function lpAt(points, t){
    if (t<=points[0].t) return points[0].lp;
    const n=points.length; if (t>=points[n-1].t) return points[n-1].lp;
    for (let k=1;k<n;k++){ if (points[k].t>=t){ const a=points[k-1],b=points[k]; const f=(t-a.t)/((b.t-a.t)||1); return a.lp+(b.lp-a.lp)*f; } }
    return points[n-1].lp;
  }
  function eloHover(e){
    const box=$('elo-chart'), d=box&&box._elo; if(!d) return;
    const svg=$('elo-svg'), rect=svg.getBoundingClientRect(); if(!rect.width) return;
    const vbX=(e.clientX-rect.left)/rect.width*d.W, vbY=(e.clientY-rect.top)/rect.height*d.H;
    const frac=Math.max(0,Math.min(1,(vbX-40)/((d.W-40-12)||1)));   // PL=40, PR=12
    const t=d.tMin+frac*(d.tMax-d.tMin);
    // Serie visible más cercana en Y al cursor.
    let best=-1, bestDy=Infinity, bestLp=0;
    d.series.forEach((s,i)=>{ if(hidden.has(s.rid)||s.pts.length<2)return; const lp=lpAt(s.pts,t); const dy=Math.abs(d.Y(lp)-vbY); if(dy<bestDy){bestDy=dy;best=i;bestLp=lp;} });
    if(best<0 || bestDy>28){ eloHideHover(); return; }   // umbral (unidades viewBox)
    const s=d.series[best], c=PALETTE[best%PALETTE.length];
    const px=d.X(t)/d.W*rect.width, py=d.Y(bestLp)/d.H*rect.height;
    document.querySelectorAll('#elo-svg .eline').forEach(p=>{ const on=+p.dataset.i===best; p.style.strokeWidth=on?'3':'1.5'; p.style.opacity=on?'1':'.25'; });
    const dot=$('elo-dot'), tip=$('elo-tip');
    if(dot){ dot.style.display='block'; dot.style.left=px+'px'; dot.style.top=py+'px'; dot.style.background=c; }
    if(tip){ tip.style.display='block'; tip.style.left=px+'px'; tip.style.top=py+'px';
      tip.style.transform = py>80?'translate(-50%,calc(-100% - 12px))':'translate(-50%,12px)';
      const dstr=new Date(t).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'2-digit'});
      tip.innerHTML=`<span class="nmc"><span class="sw" style="background:${c}"></span>${esc(s.nm)}</span><div class="d">${eloTierLabel(bestLp)} · ${dstr}</div>`;
    }
  }

  // ---- COINCIDENCIAS ----
  function encCard(e){
    const ps = e.players||[]; const win = ps.filter(p=>p.win), lose = ps.filter(p=>!p.win);
    const rivals = win.length && lose.length;
    const p = x => `<span class="p">${esc(x.nm)}<span class="res ${x.win?'w':'l'}">${x.win?'G':'P'}</span></span>`;
    const body = rivals
      ? `<div class="side">${win.map(p).join('')}</div><span class="vs">VS</span><div class="side">${lose.map(p).join('')}</div>`
      : `<div class="side">${ps.map(p).join('')}</div>`;
    return `<div class="encc">${rivals?'<span class="tag rival">⚔ Enfrentados</span>':'<span class="tag ally">🤝 Mismo equipo</span>'}
      ${body}<span class="date">${fdate(e.end)}</span></div>`;
  }
  function renderCoinc(){
    const c = DATA.coincidencias;
    const verd = (c.verdugos||[]).map((v,i) => `<div class="rowl">
      <div class="rk ${i<3?('t'+(i+1)):''}">${i+1}</div>
      <div class="meta"><div class="nm">${esc(v.nm)}${eloTag(v.high)}</div><div class="games">${v.duels} duelos · ${v.wr}% ganados</div></div>
      <div class="val">${v.wins}<span style="font-size:10px;color:var(--muted);font-weight:700"> V</span></div></div>`).join('');
    const duel = (c.duelos||[]).map(d => `<div class="duel">
      <span>${esc(d.a.nm)}</span><span class="score">${d.aw}–${d.bw}</span><span>${esc(d.b.nm)}</span>
      ${d.together?`<span class="tg">${d.together} en el mismo equipo</span>`:''}</div>`).join('');
    const duoRows = arr => (arr||[]).map((d,i) => `<div class="rowl">
      <div class="rk ${i<3?('t'+(i+1)):''}">${i+1}</div>
      <div class="meta"><div class="nm">${esc(d.a.nm)} <span style="color:var(--muted-2)">+</span> ${esc(d.b.nm)}</div><div class="games">${d.games} juntos · ${d.wins}V ${d.games-d.wins}D</div></div>
      <div class="val">${d.wr}%</div></div>`).join('');
    const hist = (c.historial||[]).slice(0,20).map(encCard).join('');
    $('p-coinc').innerHTML = `
      <div class="kpi"><b>${c.count||0}</b> coincidencias registradas — cuando dos o más participantes caen en la misma partida.</div>
      <div class="grid">
        <div class="card"><h3>VERDUGOS DEL TORNEO</h3><div class="cap">Más victorias contra otros participantes</div>${verd||'<div class="empty">Sin datos</div>'}</div>
        <div class="card"><h3>DUELOS</h3><div class="cap">Cara a cara acumulado (solo en equipos contrarios)</div>${duel||'<div class="empty">Sin datos</div>'}</div>
        <div class="card"><h3>MEJORES DÚOS</h3><div class="cap">Mejor winrate en el mismo equipo (mín. 2 partidas)</div>${duoRows(c.duosBest)||'<div class="empty">Sin datos</div>'}</div>
        <div class="card"><h3>PEORES DÚOS</h3><div class="cap">Peor winrate en el mismo equipo (mín. 2 partidas)</div>${duoRows(c.duosWorst)||'<div class="empty">Sin datos</div>'}</div>
      </div>
      <div class="subh">Historial de coincidencias — últimas partidas compartidas</div>
      <div class="enc">${hist||'<div class="empty">Sin coincidencias aún</div>'}</div>`;
  }

  // ---- CONTRINCANTES (rivales ajenos al torneo) ----
  function rivalRow(o, i, metric){
    const big = metric==='w' ? o.w : o.l;
    const opgg = o.rid ? `https://op.gg/lol/summoners/las/${encodeURIComponent(String(o.rid).replace('#','-'))}` : null;
    const name = opgg ? `<a href="${opgg}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(o.nm)}</a>` : esc(o.nm);
    return `<div class="rowl">
      <div class="rk ${i<3?('t'+(i+1)):''}">${i+1}</div>
      <div class="meta"><div class="nm">${name}</div><div class="games">${o.w}V · ${o.l}D</div></div>
      <div class="val" style="color:${metric==='w'?'var(--up)':'var(--down)'}">${big}<span style="font-size:10px;color:var(--muted);font-weight:700"> ${metric==='w'?'V':'D'}</span></div></div>`;
  }
  function renderRivales(){
    const c = DATA.contrincantes || {};
    const best  = (c.best ||[]).map((o,i)=>rivalRow(o,i,'w')).join('');
    const worst = (c.worst||[]).map((o,i)=>rivalRow(o,i,'l')).join('');
    $('p-rivales').innerHTML = `
      <div class="kpi">Rivales <b>ajenos al SoloQ Chile</b> que más veces enfrentamos (mín. 2 partidas). Son partidas ganadas/perdidas contra ellos, no porcentaje.</div>
      <div class="grid">
        <div class="card"><h3>MEJORES CONTRINCANTES</h3><div class="cap">A los que más les hemos ganado</div>${best||'<div class="empty">Sin datos</div>'}</div>
        <div class="card"><h3>PEORES CONTRINCANTES</h3><div class="cap">Los que más nos han ganado</div>${worst||'<div class="empty">Sin datos</div>'}</div>
      </div>`;
  }

  async function load(){
    try {
      const r = await fetch('/api/stats', { cache:'no-store' });
      if (!r.ok) throw new Error('HTTP '+r.status);
      DATA = await r.json();
      renderTops(); renderElo(); renderCoinc(); renderRivales();
    } catch (e) {
      $('p-tops').innerHTML = '<div class="empty">No se pudieron cargar las estadísticas.<br><small>'+esc(e.message)+'</small></div>';
    }
  }

  SQC.preNav(); SQC.mountNav();
  load();
</script>
</body>
</html>
