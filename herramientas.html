<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoloQ Challenge — Herramientas</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
  :root{
    --bg:#0b0b0b; --panel:#0b0c10; --panel-2:#121319; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#fff; --muted:rgba(255,255,255,.55); --muted-2:rgba(255,255,255,.38);
    --accent:#e9ff1f; --up:#34d399; --down:#fb7185; --gold:#ffd24a; --blue:#4aa3ff; --purple:#c084fc;
    --font:'General Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:radial-gradient(1100px 550px at 50% -200px, rgba(233,255,31,.05), transparent 60%), var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }
  main.wrap{ padding-bottom:64px; }   /* aire al final de la página */
  .brand b span{ color:var(--accent); }
  h1{ font-size:30px; letter-spacing:-.02em; margin:26px 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:20px; }

  /* Tabs */
  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .tab{ background:none; border:0; color:var(--muted); font-family:inherit; font-size:13px; font-weight:800; letter-spacing:.06em;
    padding:11px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover{ color:#fff; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .tab{ position:relative; }
  .tab-badge{ display:none; margin-left:6px; font-size:9px; font-weight:800; color:#000; background:var(--down); border-radius:999px; padding:1px 6px; vertical-align:middle; letter-spacing:0; }
  .panel{ display:none; } .panel.active{ display:block; }
  /* ---- Análisis: polígono comparativo, fase de líneas, campeones, evolución y partidas ---- */
  .an-ctrl{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
  .an-ctrl label{ display:flex; flex-direction:column; gap:5px; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); }
  .an-ctrl select, .an-pick input{ font-family:inherit; font-size:13px; font-weight:700; color:var(--text); background:var(--panel); border:1px solid var(--line-2); border-radius:9px; padding:8px 10px; text-transform:none; letter-spacing:0; }
  .an-ctrl select option{ background:#121319; }
  .an-pick{ position:relative; } .an-pick input{ width:230px; outline:none; } .an-pick input:focus{ border-color:var(--accent); }
  .an-dd{ display:none; position:absolute; z-index:30; top:calc(100% + 4px); left:0; width:300px; max-height:320px; overflow-y:auto; background:#14161d; border:1px solid var(--line-2); border-radius:10px; padding:4px; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .an-o{ padding:7px 9px; border-radius:7px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .an-o:hover{ background:rgba(255,255,255,.07); } .an-o.none{ cursor:default; color:var(--muted-2); font-size:12px; font-weight:600; }
  .an-o b{ display:block; font-size:13px; font-weight:700; color:var(--text); } .an-o small{ display:block; font-size:11px; font-weight:600; color:var(--muted-2); margin-top:1px; }
  .an-sw{ display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
  .an-sw.b{ background:repeating-linear-gradient(90deg,var(--an-b) 0 5px,transparent 5px 8px); }
  .an-top{ display:grid; grid-template-columns:minmax(300px,460px) 1fr; gap:14px; align-items:start; }
  @media (max-width:860px){ .an-top{ grid-template-columns:1fr; } }
  .an-radar{ width:100%; height:auto; display:block; }
  .an-radar text, .an-evo text{ font-family:var(--font); }
  .an-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; font-weight:700; margin-bottom:6px; }
  .an-tbl{ width:100%; border-collapse:collapse; }
  .an-tbl th, .an-tbl td{ padding:8px 10px; font-size:13px; border-top:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
  .an-tbl th{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); border-top:none; }
  .an-tbl td:first-child, .an-tbl th:first-child{ text-align:left; color:var(--muted); font-weight:600; }
  .an-tbl td.best{ font-weight:800; }
  .an-tbl td small{ color:var(--muted-2); font-weight:600; margin-left:5px; }
  .an-games{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; margin-top:14px; }
  .an-list{ max-height:640px; overflow-y:auto; margin:0 -6px; padding:0 6px; }
  .an-g{ display:grid; grid-template-columns:4px 34px 1fr auto; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); min-height:46px; }
  .an-g:first-child, .an-c:first-child{ border-top:none; }
  .an-g .bar{ align-self:stretch; border-radius:2px; background:var(--down); } .an-g.w .bar{ background:var(--up); } .an-g.v .bar{ background:var(--gold); }
  .an-g img, .an-c img{ width:34px; height:34px; border-radius:8px; background:var(--panel-2); }
  .an-g .l1, .an-c .l1{ font-size:13px; font-weight:700; } .an-g .l1 span{ color:var(--muted-2); font-weight:600; }
  .an-g .l2, .an-c .l2{ font-size:11px; color:var(--muted-2); margin-top:1px; }
  .an-g .rt{ text-align:right; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; } .an-g .rt small{ display:block; font-size:10.5px; font-weight:600; color:var(--muted-2); }
  .an-champs{ max-height:262px; overflow-y:auto; margin:0 -6px; padding:0 6px; }
  .an-c{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); height:52px; }
  .an-c .wr{ display:flex; align-items:center; gap:8px; font-size:13px; font-variant-numeric:tabular-nums; } .an-c .wr b{ min-width:38px; text-align:right; }
  .an-c .wrbar{ width:70px; height:6px; border-radius:3px; background:rgba(255,255,255,.09); overflow:hidden; display:block; } .an-c .wrbar i{ display:block; height:100%; border-radius:3px; background:rgba(255,255,255,.55); }
  .an-evos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px 18px; }
  .an-evo .t{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; margin-bottom:2px; }
  .an-evo .t b{ font-weight:800; } .an-evo .t .v{ display:flex; gap:10px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--muted); }
  .an-evo svg{ width:100%; height:auto; display:block; }
  .an-evo .rng{ font-size:10px; color:var(--muted-2); margin-top:1px; }
  .an-tip{ position:fixed; z-index:50; pointer-events:none; background:#16181f; border:1px solid var(--line-2); border-radius:8px; padding:6px 9px; font-size:12px; font-weight:600; display:none; white-space:nowrap; }
  .an-tip b{ font-weight:800; }
  /* Récord nuevo/cambiado: resalta la card la primera vez que lo ves */
  .rec-banner{ display:flex; align-items:center; gap:8px; background:linear-gradient(180deg,rgba(52,211,153,.14),rgba(52,211,153,.04)); border:1px solid rgba(52,211,153,.4); color:var(--up); border-radius:12px; padding:10px 14px; font-size:13px; font-weight:700; margin-bottom:14px; }
  .card.rec-new{ border-color:var(--up); box-shadow:0 0 0 1px var(--up), 0 0 22px rgba(52,211,153,.25); animation:recpulse 1.6s ease 2; }
  @keyframes recpulse{ 0%,100%{ box-shadow:0 0 0 1px var(--up), 0 0 22px rgba(52,211,153,.15); } 50%{ box-shadow:0 0 0 1px var(--up), 0 0 30px rgba(52,211,153,.5); } }
  .rec-new-badge{ margin-left:8px; font-size:9px; font-weight:800; color:#000; background:var(--up); border-radius:5px; padding:2px 6px; letter-spacing:.04em; vertical-align:middle; }
  .nm .rec-new-badge{ margin-left:6px; padding:1px 5px; font-size:8px; }
  .rowl.rec-row-new{ background:rgba(52,211,153,.12); border-radius:8px; box-shadow:inset 0 0 0 1px rgba(52,211,153,.4); }
  /* Equipos */
  .tcard h3 .tmem{ font-size:11px; color:var(--muted-2); font-weight:700; margin-left:8px; }
  .tgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 4px; }
  .tstat{ text-align:center; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 6px; }
  .tstat .tv{ font-size:21px; font-weight:800; }
  .tstat .tk{ font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.03em; }
  .tstat .tsub{ font-size:9.5px; color:var(--muted-2); margin-top:4px; line-height:1.3; }
  .tduo{ font-size:12.5px; color:var(--text); border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .tduo-k{ font-size:10px; color:var(--muted); font-weight:800; letter-spacing:.04em; margin-right:6px; }
  /* Menciones */
  .mgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .mcard{ display:flex; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
  .mc-emoji{ font-size:29px; line-height:1; flex-shrink:0; }
  .mc-body{ min-width:0; }
  .mc-title{ font-weight:800; font-size:14px; color:var(--accent); letter-spacing:.02em; }
  .mc-sub{ font-size:10.5px; color:var(--muted-2); margin:2px 0 8px; line-height:1.3; }
  .mc-win{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .mc-nm{ font-weight:800; font-size:15px; color:#fff; }
  .mc-val{ font-weight:800; font-size:13px; color:var(--up); }
  .mc-det{ font-size:11px; color:var(--muted); margin-top:3px; }
  .mcard.mclick{ cursor:pointer; }
  .mcard.mclick:hover{ border-color:var(--line-strong,rgba(255,255,255,.18)); }
  .mc-more{ font-size:9.5px; font-weight:700; color:var(--muted-2); margin-left:8px; white-space:nowrap; }
  .mtop{ margin-top:10px; border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:5px; }
  .mtop[hidden]{ display:none; }
  .mrow{ font-size:11.5px; line-height:1.35; }
  .mrow .mrk{ color:var(--muted-2); font-weight:800; margin-right:5px; }
  .mrow .mrn{ color:#fff; font-weight:700; }
  .mrow .mrv{ color:var(--up); font-weight:800; margin-left:6px; }
  .mrow .mrd{ color:var(--muted); font-size:10.5px; margin-left:5px; }

  /* Cards */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card h3{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--accent); }
  .card .cap{ font-size:11px; color:var(--muted-2); margin:2px 0 12px; }
  .rowl{ display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); }
  .rowl:first-of-type{ border-top:0; }
  .rk{ width:20px; text-align:center; font-size:13px; font-weight:800; color:var(--muted); flex-shrink:0; }
  .rk.t1{ color:var(--gold); } .rk.t2{ color:#d7dde3; } .rk.t3{ color:#e0a878; }
  .nm{ font-size:14px; font-weight:700; }
  .elo-tag{ font-size:9px; font-weight:800; letter-spacing:.04em; padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:middle; }
  .elo-tag.high{ color:var(--accent); background:rgba(233,255,31,.12); border:1px solid rgba(233,255,31,.35); }
  .elo-tag.low{ color:var(--blue); background:rgba(74,163,255,.12); border:1px solid rgba(74,163,255,.35); }
  .games{ font-size:11px; color:var(--muted-2); }
  .val{ margin-left:auto; font-size:16px; font-weight:800; color:#fff; }
  .meta{ display:flex; flex-direction:column; min-width:0; }

  /* ELO: subidones/bajones */
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:640px){ .two{ grid-template-columns:1fr; } }
  .day{ font-size:11px; color:var(--muted-2); }
  .net{ margin-left:auto; font-size:15px; font-weight:800; }
  .net.up{ color:var(--up); } .net.down{ color:var(--down); }

  /* Chart */
  .chartwrap{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:14px; }
  .chartwrap h3{ font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--accent); }
  .chartwrap .cap{ font-size:11px; color:var(--muted-2); margin:2px 0 10px; }
  #elo-svg{ width:100%; height:380px; display:block; }
  /* Chart de elo promedio con hover interactivo */
  .avg-chart{ position:relative; }
  .avg-chart svg{ width:100%; display:block; cursor:crosshair; }
  .avg-guide{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.28); pointer-events:none; display:none; transform:translateX(-.5px); }
  .avg-dot{ position:absolute; width:10px; height:10px; border-radius:50%; background:var(--accent); border:1.5px solid #000; pointer-events:none; display:none; transform:translate(-50%,-50%); box-shadow:0 0 8px rgba(233,255,31,.6); }
  .avg-tip{ position:absolute; pointer-events:none; background:rgba(12,13,17,.96); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; font-weight:700; color:#fff; text-align:center; transform:translate(-50%,calc(-100% - 10px)); white-space:nowrap; z-index:5; display:none; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .avg-tip .d{ color:var(--muted); font-size:10px; font-weight:600; }
  .avg-tip b{ color:var(--accent); }
  .avg-date{ position:absolute; bottom:3px; pointer-events:none; transform:translateX(-50%); font-size:10px; font-weight:800; color:#000; background:var(--accent); padding:1px 6px; border-radius:4px; display:none; white-space:nowrap; }
  /* Evolución de elo: hover para identificar la línea */
  .elo-chart{ position:relative; }
  .elo-chart svg{ cursor:crosshair; }
  .eline{ transition:stroke-width .08s, opacity .08s; }
  .elo-dot{ position:absolute; width:11px; height:11px; border-radius:50%; border:2px solid #000; pointer-events:none; display:none; transform:translate(-50%,-50%); box-shadow:0 0 8px rgba(0,0,0,.6); }
  .elo-tip{ position:absolute; pointer-events:none; background:rgba(12,13,17,.97); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; font-weight:700; color:#fff; white-space:nowrap; z-index:6; display:none; transform:translate(-50%,calc(-100% - 12px)); box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .elo-tip .d{ color:var(--muted); font-size:10px; font-weight:600; margin-top:2px; }
  .elo-tip .nmc{ display:inline-flex; align-items:center; gap:6px; }
  .elo-tip .sw{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .legend{ display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:12px; }
  .lg{ font-size:11px; color:var(--muted); cursor:pointer; padding:2px 7px; border-radius:6px; border:1px solid var(--line); user-select:none; }
  .lg .dot{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .lg.off{ opacity:.35; text-decoration:line-through; }
  .elo-range-row{ display:flex; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
  .elo-range-row .rlbl{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.04em; }
  .elo-range-row input[type=range]{ flex:0 1 220px; accent-color:var(--accent); cursor:pointer; }
  .elo-range-row .cap{ margin:0; }
  .legend-tools{ display:flex; gap:8px; margin-top:12px; }
  .lgt{ font-family:inherit; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:rgba(255,255,255,.04); }
  .lgt:hover{ color:#fff; border-color:var(--line-2); }

  /* Coincidencias */
  .kpi{ font-size:12px; color:var(--muted); margin-bottom:16px; }
  .kpi b{ color:var(--accent); font-size:15px; }
  .duel{ padding:10px 0; border-top:1px solid var(--line); }
  .duel:first-of-type{ border-top:0; }
  .drow{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .drow .dn{ flex:0 0 24%; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .drow .dn.a{ text-align:right; } .drow .dn.b{ text-align:left; }
  /* Barra "versus": el ancho de cada lado = su cuota de victorias del cara a cara; el número va centrado en su lado. */
  .hbar{ flex:1; display:flex; height:24px; border-radius:6px; overflow:hidden; background:var(--panel-2); border:1px solid var(--line); min-width:80px; }
  .hseg{ flex-grow:0; flex-basis:0; min-width:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .hseg.has{ min-width:22px; }
  .hseg.a{ background:var(--blue); } .hseg.b{ background:var(--down); }
  /* Ganador del duelo (más victorias): nombre y segmento en DORADO. */
  .drow .dn.win{ color:var(--gold); font-weight:800; }
  .hseg.win{ background:var(--gold); color:#0b0b0b; text-shadow:none; }
  .dsub{ text-align:center; font-size:10.5px; color:var(--muted-2); margin-top:4px; }
  .enc{ display:flex; flex-direction:column; gap:10px; }
  .encc{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .encc .tag{ font-size:10px; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:6px; flex-shrink:0; }
  .encc .tag.rival{ background:rgba(251,113,133,.14); color:var(--down); border:1px solid rgba(251,113,133,.4); }
  .encc .tag.ally{ background:rgba(52,211,153,.14); color:var(--up); border:1px solid rgba(52,211,153,.4); }
  .encc .side{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .encc .p{ font-size:13px; font-weight:700; } .encc .p .res{ font-size:10px; font-weight:800; margin-left:4px; }
  .encc .p .res.w{ color:var(--up); } .encc .p .res.l{ color:var(--down); }
  .encc .vs{ font-size:11px; font-weight:800; color:var(--muted-2); }
  .encc .date{ margin-left:auto; font-size:11px; color:var(--muted-2); }
  .empty{ color:var(--muted); font-size:14px; text-align:center; padding:40px 0; }
  .loading{ color:var(--muted); font-size:14px; text-align:center; padding:60px 0; }
  .subh{ font-size:15px; font-weight:700; margin:26px 0 12px; }
  /* ---- Organizador de 5v5 ---- */
  .fv-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .fv-head h2{ font-size:18px; font-weight:800; } .fv-head .cnt{ font-size:13px; color:var(--muted); font-weight:700; margin-left:8px; }
  .fv-btn{ font-family:inherit; cursor:pointer; font-size:13px; font-weight:800; padding:9px 15px; border-radius:10px; border:1px solid var(--line-2); background:var(--panel); color:var(--text); }
  .fv-btn:hover:not(:disabled){ border-color:rgba(255,255,255,.3); } .fv-btn:disabled{ opacity:.45; cursor:default; }
  .fv-btn.pri{ background:var(--accent); color:#0b0b0b; border-color:var(--accent); }
  .fv-btn.sm{ font-size:11.5px; padding:5px 9px; border-radius:8px; }
  .fv-invite{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .fv-invite label{ font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); }
  .fv-invite input{ flex:1; min-width:220px; font-family:inherit; font-size:13px; font-weight:600; color:var(--text); background:var(--panel-2); border:1px solid var(--line-2); border-radius:9px; padding:8px 10px; }
  .fv-invite .exp{ flex-basis:100%; font-size:11.5px; color:var(--muted-2); }
  .fv-hid{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12.5px; font-weight:600; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-top:14px; }
  .fv-hid + .fv-teams{ margin-top:10px; } .fv-hid + .fv-hid{ margin-top:8px; }
  .fv-btn.on{ border-color:var(--accent); color:var(--accent); }

<script>
  const $ = id => document.getElementById(id);
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fdate = ms => ms ? new Date(ms).toLocaleString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
  if (window.SQC && SQC.preNav) SQC.preNav();
  if (window.SQC && SQC.mountNav) SQC.mountNav();

  // ---- Tabs ----
  let CUR_TAB = 'fv';
  function showTab(t){
    CUR_TAB = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.t === t));
    document.querySelectorAll('.panel').forEach(x => x.classList.toggle('active', x.id === 'p-' + t));
    if (history.replaceState) history.replaceState(null, '', '#' + t);
    if (t === 'analisis' && !AN.data) loadAnalysis();
    if (t === 'fv') fvLoad(true);
    if (t === 'rk'){ rkLoad(true); rkBoard(); }
    if (t === 'dle'){ const f = $('dle-frame'); if (!f.src) f.src = 'soloqdle.html'; }
    if (t === 'sb'){ sbLoad(true); sbRankLoad().then(() => { if (!SBC.st || SBC.st.status === 'done') sbRender(); }); }
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.t));

  // ---- ANÁLISIS: polígono comparativo, fase de líneas, pool de campeones, evolución y últimas partidas ----
  const AN = { n:'all', mode:'top', data:null, a:null, b:null, det:{} };
  const AN_COL = { a:'#3987e5', b:'#d9662b' };   // par validado (daltonismo + contraste sobre fondo oscuro)
  const anInt = v => Math.round(v).toLocaleString('es-CL');
  const AN_AXES = [
    { k:'wr',      lbl:'Winrate',      fmt:v => v.toFixed(1)+'%' },
    { k:'kda',     lbl:'KDA',          fmt:v => v.toFixed(2) },
    { k:'kp',      lbl:'Part. kills',  fmt:v => v.toFixed(1)+'%' },
    { k:'csmin',   lbl:'CS/min',       fmt:v => v.toFixed(2) },
    { k:'goldmin', lbl:'Oro/min',      fmt:anInt },
    { k:'dmgmin',  lbl:'Daño/min',     fmt:anInt },
    { k:'vismin',  lbl:'Visión/min',   fmt:v => v.toFixed(2) },
    { k:'lvlmin',  lbl:'Nivel/min',    fmt:v => v.toFixed(2) },
    { k:'abs',     lbl:'PL',           fmt:(v,p) => anRank(p) },
  ];
  const AN_LANE = [
    { k:'cs10',    lbl:'CS al minuto 10',                  fmt:v => v.toFixed(1) },
    { k:'csadv',   lbl:'Ventaja máx. de CS sobre su rival', fmt:v => v.toFixed(1) },
    { k:'lvllead', lbl:'Ventaja máx. de nivel sobre su rival', fmt:v => v.toFixed(2) },
    { k:'solok',   lbl:'Solo kills por partida',           fmt:v => v.toFixed(2) },
  ];
  // métricas que se pueden seguir partida a partida
  const AN_EVO = [
    { k:'kda',     lbl:'KDA',         get:g => (g.k + g.a) / Math.max(1, g.d),   fmt:v => v.toFixed(2) },
    { k:'kp',      lbl:'Part. kills', get:g => g.kp,                              fmt:v => Math.round(v)+'%' },
    { k:'csmin',   lbl:'CS/min',      get:g => g.cs / (g.dur / 60 || 1),          fmt:v => v.toFixed(1) },
    { k:'goldmin', lbl:'Oro/min',     get:g => g.gold / (g.dur / 60 || 1),        fmt:anInt },
    { k:'dmgmin',  lbl:'Daño/min',    get:g => g.dmg / (g.dur / 60 || 1),         fmt:anInt },
    { k:'vismin',  lbl:'Visión/min',  get:g => g.vis / (g.dur / 60 || 1),         fmt:v => v.toFixed(2) },
  ];
  const AN_ROLES = { TOP:'Top', JUNGLE:'Jungla', MIDDLE:'Mid', BOTTOM:'ADC', UTILITY:'Support' };
  const AN_TIER = { IRON:'Hierro', BRONZE:'Bronce', SILVER:'Plata', GOLD:'Oro', PLATINUM:'Platino', EMERALD:'Esmeralda', DIAMOND:'Diamante', MASTER:'Maestro', GRANDMASTER:'Gran Maestro', CHALLENGER:'Retador' };
  function anAbsLabel(abs){ if (abs == null) return '—'; abs = Math.round(abs); if (abs >= 2800) return 'Maestro+ ' + (abs - 2800) + ' PL';
    const T = ['Hierro','Bronce','Plata','Oro','Platino','Esmeralda','Diamante'], D = ['IV','III','II','I'], ti = Math.min(6, Math.floor(abs / 400)), rem = abs - ti * 400, di = Math.min(3, Math.floor(rem / 100));
    return `${T[ti]} ${D[di]} ${rem - di * 100} PL`; }
  const anRank = p => p.isAvg ? anAbsLabel(p.abs) : (!p.tier || p.tier === 'UNRANKED') ? 'Sin rango' : `${AN_TIER[p.tier] || p.tier}${p.div ? ' ' + p.div : ''} ${p.lp} PL`;
  const anDDV = (window.SQC_DATA && window.SQC_DATA.ddragonVersion) || '16.15.1';
  const anChamp = c => c ? `https://ddragon.leagueoflegends.com/cdn/${anDDV}/img/champion/${({FiddleSticks:'Fiddlesticks'})[c] || c}.png` : '';
  const anPool = () => (AN.data && AN.data.players || []).filter(x => x.games >= 5);
  // Promedio de los jugadores del challenge cuyo rol principal es ese (se comporta como un "jugador" más).
  function anRoleAvg(role){
    const ps = anPool().filter(p => p.role === role); if (!ps.length) return null;
    const o = { key:'@' + role, nm:'Promedio ' + AN_ROLES[role], isAvg:true, role, games:ps.length };
    ['wr','kda','kp','csmin','goldmin','dmgmin','vismin','lvlmin','abs','k','d','a','cs10','csadv','lvllead','solok'].forEach(k => {
      const v = ps.map(p => p[k]).filter(x => x != null); o[k] = v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; });
    ['k','d','a'].forEach(k => { if (o[k] != null) o[k] = Math.round(o[k] * 10) / 10; });
    return o;
  }
  const anFind = key => !key ? null : key[0] === '@' ? anRoleAvg(key.slice(1)) : ((AN.data && AN.data.players || []).find(p => p.key === key) || null);
  // Percentil (0-100) en una métrica frente a los demás jugadores del challenge con partidas suficientes.
  function anPct(p, k){
    const pool = anPool().map(x => x[k]).filter(v => v != null);
    if (p[k] == null || !pool.length) return 0;
    const below = pool.filter(v => v < p[k]).length, eq = pool.filter(v => v === p[k]).length;
    return Math.max(4, Math.round((below + eq / 2) / pool.length * 100));
  }
  const anLabel = p => p.isAvg ? p.nm : p.nm + (p.smurf ? ' · smurf' : '');
  const anSub = p => p.isAvg ? `${p.games} jugadores` : p.rid + (AN.mode === 'merge' && p.accts.length > 1 ? ` +${p.accts.length - 1} cuenta${p.accts.length > 2 ? 's' : ''}` : '');
  async function loadAnalysis(){
    const box = $('p-analisis');
    try { const r = await fetch(`/api/analysis?n=${AN.n}&mode=${AN.mode}`); if (!r.ok) throw new Error('HTTP ' + r.status); AN.data = await r.json(); }
    catch (e) { box.innerHTML = `<div class="loading">No se pudo cargar el análisis.</div>`; return; }
    const ps = AN.data.players || [];
    if (!ps.length){ box.innerHTML = `<div class="loading">Aún no hay partidas guardadas.</div>`; return; }
    if (!anFind(AN.a)) AN.a = ps[0].key;
    if (AN.b && (!anFind(AN.b) || AN.b === AN.a)) AN.b = null;
    renderAnalysis(); anLoadDet(AN.a); anLoadDet(AN.b);
  }
  async function anLoadDet(key){
    if (!key || key[0] === '@') return;
    const ck = AN.mode + '|' + key; if (AN.det[ck]) return;
    try { const r = await fetch(`/api/analysis/detail?mode=${AN.mode}&key=${encodeURIComponent(key)}`); AN.det[ck] = r.ok ? await r.json() : { games:[], champs:[] }; }
    catch (e) { AN.det[ck] = { games:[], champs:[] }; }
    renderAnalysis();
  }
  const anDet = p => p.isAvg ? null : AN.det[AN.mode + '|' + p.key];
  const anSw = key => `<span class="an-sw ${key}" style="${key === 'a' ? 'background:' + AN_COL.a : ''}"></span>`;
  function anRadar(sel){
    const W = 460, H = 410, cx = W / 2, cy = H / 2 + 4, R = 138, N = AN_AXES.length;
    const pt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
    const ring = f => AN_AXES.map((_, i) => pt(i, f).map(v => v.toFixed(1)).join(',')).join(' ');
    let g = [0.25, 0.5, 0.75, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="rgba(255,255,255,${f === 1 ? .16 : .07})" stroke-width="1"/>`).join('');
    g += AN_AXES.map((ax, i) => { const [x, y] = pt(i, 1), [lx, ly] = pt(i, 1.16);
      const anc = Math.abs(lx - cx) < 8 ? 'middle' : (lx > cx ? 'start' : 'end');
      return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.07)"/>
        <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anc}" font-size="11.5" font-weight="700" fill="rgba(255,255,255,.62)">${ax.lbl}</text>`; }).join('');
    g += `<text x="${cx + 7}" y="${cy - R * 0.5 - 3}" font-size="9" fill="rgba(255,255,255,.32)">50</text><text x="${cx + 7}" y="${cy - R + 11}" font-size="9" fill="rgba(255,255,255,.32)">100</text>`;
    sel.forEach(({ p, key }) => {
      const col = AN_COL[key], pts = AN_AXES.map((ax, i) => pt(i, anPct(p, ax.k) / 100));
      g += `<polygon points="${pts.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${col}" fill-opacity=".16" stroke="${col}" stroke-width="2" stroke-linejoin="round" ${key === 'b' ? 'stroke-dasharray="6 4"' : ''}/>`;
      g += pts.map((q, i) => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="${col}" stroke="#0b0c10" stroke-width="2"/>
        <circle class="an-hit" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="11" fill="transparent" data-tip="${esc(`<b>${anLabel(p)}</b> · ${AN_AXES[i].lbl}: ${AN_AXES[i].fmt(p[AN_AXES[i].k] || 0, p)} · percentil ${anPct(p, AN_AXES[i].k)}`)}"/>`).join('');
    });
    return `<svg class="an-radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Polígono comparativo por percentil">${g}</svg>`;
  }
  // Tabla A vs B para una lista de métricas (el mejor de cada fila va en negrita).
  function anTable(list, A, B, withPct){
    const cell = (p, other, ax) => { const v = p[ax.k]; if (v == null) return `<td>—</td>`;
      const best = !ax.neutral && other && other[ax.k] != null && v > other[ax.k];
      return `<td class="${best ? 'best' : ''}">${ax.fmt(v, p)}${withPct && !ax.neutral ? `<small>P${anPct(p, ax.k)}</small>` : ''}</td>`; };
    return `<table class="an-tbl"><thead><tr><th>Métrica</th><th>${esc(anLabel(A))}</th>${B ? `<th>${esc(anLabel(B))}</th>` : ''}</tr></thead><tbody>` +
      list.map(ax => `<tr><td>${ax.lbl}</td>${cell(A, B, ax)}${B ? cell(B, A, ax) : ''}</tr>`).join('') + `</tbody></table>`;
  }
  function anChamps(p, key){
    const d = anDet(p), head = `<h3>${anSw(key)}${esc(anLabel(p))} · campeones</h3><div class="cap">Pool completo sobre todas sus partidas guardadas${d && d.total ? ` (${d.total})` : ''}. Se ven 5; desliza para el resto.</div>`;
    if (!d) return `<div class="card">${head}<div class="loading" style="padding:24px 0">Cargando…</div></div>`;
    if (!d.champs.length) return `<div class="card">${head}<div class="loading" style="padding:24px 0">Sin partidas guardadas</div></div>`;
    return `<div class="card">${head}<div class="an-champs">` + d.champs.map(c => `<div class="an-c">
        <img src="${anChamp(c.champ)}" alt="" onerror="this.style.visibility='hidden'">
        <div><div class="l1">${esc(c.champ)}</div><div class="l2">${c.games} partida${c.games === 1 ? '' : 's'} · KDA ${c.kda.toFixed(2)}</div></div>
        <div class="wr"><span class="wrbar"><i style="width:${c.wr}%"></i></span><b>${c.wr}%</b></div></div>`).join('') + `</div></div>`;
  }
  // Una mini-gráfica por métrica: una línea por jugador, de la partida más antigua a la más reciente.
  function anEvo(sel){
    const series = sel.map(({ p, key }) => { const d = anDet(p); const gs = d ? d.games.filter(g => !g.voided && !g.off).slice(0, AN.n === 'all' ? 60 : +AN.n).reverse() : null; return { p, key, gs }; });
    if (series.some(s => !s.p.isAvg && !s.gs)) return `<div class="card"><h3>Evolución</h3><div class="loading" style="padding:24px 0">Cargando…</div></div>`;
    const W = 300, H = 104, L = 8, Rr = 8, T = 10, B = 16;
    const charts = AN_EVO.map(m => {
      const lines = series.filter(s => s.gs && s.gs.length).map(s => ({ ...s, vals: s.gs.map(g => m.get(g)).filter(v => v != null) })).filter(s => s.vals.length);
      const ref = series.find(s => s.p.isAvg && s.p[m.k] != null);
      const all = [].concat(...lines.map(s => s.vals), ref ? [ref.p[m.k]] : []);
      if (!all.length) return '';
      let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-9){ hi += 1; lo -= 1; }
      const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
      let g = `<line x1="${L}" y1="${H - B}" x2="${W - Rr}" y2="${H - B}" stroke="rgba(255,255,255,.1)"/>`;
      if (ref) g += `<line x1="${L}" y1="${Y(ref.p[m.k]).toFixed(1)}" x2="${W - Rr}" y2="${Y(ref.p[m.k]).toFixed(1)}" stroke="${AN_COL[ref.key]}" stroke-width="2" stroke-dasharray="6 4"/>`;
      lines.forEach(s => { const n = s.vals.length, X = i => n === 1 ? (L + W - Rr) / 2 : L + i * (W - L - Rr) / (n - 1), col = AN_COL[s.key];
        g += `<polyline points="${s.vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.key === 'b' ? 'stroke-dasharray="6 4"' : ''}/>`;
        g += `<circle cx="${X(n - 1).toFixed(1)}" cy="${Y(s.vals[n - 1]).toFixed(1)}" r="4" fill="${col}" stroke="#0b0c10" stroke-width="2"/>`;
        g += s.vals.map((v, i) => `<circle class="an-hit" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="9" fill="transparent" data-tip="${esc(`<b>${anLabel(s.p)}</b> · ${m.lbl}: ${m.fmt(v)} · ${s.gs[i].champ} · ${fdate(s.gs[i].end)}`)}"/>`).join(''); });
      g += `<text x="${L}" y="${H - 3}" font-size="9" fill="rgba(255,255,255,.34)">más antigua</text><text x="${W - Rr}" y="${H - 3}" text-anchor="end" font-size="9" fill="rgba(255,255,255,.34)">más reciente</text>`;
      const avgOf = s => s.vals.reduce((a, b) => a + b, 0) / s.vals.length;
      const leg = lines.map(s => `<span>${anSw(s.key)}${m.fmt(avgOf(s))}</span>`).concat(ref ? [`<span>${anSw(ref.key)}${m.fmt(ref.p[m.k])}</span>`] : []).join('');
      return `<div class="an-evo"><div class="t"><b>${m.lbl}</b><span class="v">${leg}</span></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${m.lbl} por partida">${g}</svg>
        <div class="rng">rango ${m.fmt(lo)} – ${m.fmt(hi)}</div></div>`; }).join('');
    return `<div class="card"><h3>Evolución por partida</h3><div class="cap">Cada punto es una partida de la ventana elegida; el número junto al nombre es su promedio. Pasa el mouse para ver el detalle.</div><div class="an-evos">${charts}</div></div>`;
  }

    const prog = `<div class="sb-vprog">${st.caps.map((c, k) => `<span class="${st.voted && st.voted[k] ? 'ok' : ''}">${st.voted && st.voted[k] ? '✓' : '…'} ${esc(c.nick)}</span>`).join('')}</div>`;
    if (st.me < 0) return `<div class="card sb-done"><h3>Votación final</h3><div class="fv-note">Los capitanes están ordenando los equipos (${done}/${total} votaron).</div>${prog}</div>`;
    const others = st.caps.map((_, k) => k).filter(k => k !== st.me);
    if (!SBC.vorder || SBC.vorder.length !== others.length || !SBC.vorder.every(k => others.includes(k))) SBC.vorder = (st.myVote && st.myVote.length === others.length) ? st.myVote.slice() : others.slice();
    return `<div class="card sb-done"><h3>Votación final · ordena a los otros equipos</h3>
      <div class="fv-note">Del mejor al peor, sin contar el tuyo. La tabla final sale de los votos de todos (el 1º de cada votación suma ${total - 1} puntos, el 2º ${total - 2}…). Los votos se ven al terminar.</div>
      <div class="sb-vote">${SBC.vorder.map((k, n) => `<div class="sb-vrow"><b class="pos">${n + 1}º</b><div class="nf"><div class="nm">${esc(st.caps[k].nick)}</div><small>${sbLine(st.caps[k])}</small></div>
        <button class="fv-btn sm" data-vup="${n}" ${n === 0 ? 'disabled' : ''} title="Subir">↑</button><button class="fv-btn sm" data-vdown="${n}" ${n === SBC.vorder.length - 1 ? 'disabled' : ''} title="Bajar">↓</button></div>`).join('')}</div>
      <div class="fv-err">${esc(SBC.err)}</div>
      <div class="sb-btns"><button class="fv-btn pri" id="sb-vote">${st.myVote ? 'Cambiar mi votación' : 'Enviar votación'}</button>${st.myVote ? '<span class="sb-conf ok" style="margin:0">✓ Ya votaste (puedes cambiarla hasta que voten todos)</span>' : ''}</div>
      <div class="cap" style="margin-top:10px">Votaron ${done} de ${total}</div>${prog}</div>`;
  }
  function sbFinalHtml(st){
    const f = st.final || [];
    const votes = st.votes ? st.caps.map((c, k) => st.votes[k] ? `<div class="sb-log"><b>${esc(c.nick)}</b> votó: ${st.votes[k].map((j, n) => (n + 1) + 'º ' + esc(st.caps[j].nick)).join(' · ')}</div>` : '').join('') : '';
    return `<div class="card sb-done"><h3>Tabla final · según las votaciones</h3>
      <table class="lb-rk sb-final"><thead><tr><th class="n">#</th><th>Equipo</th><th class="n">Puntos</th><th class="n">Votos como 1º</th><th class="n">Gastó</th><th>Titulares</th></tr></thead><tbody>` +
      f.map(r => { const c = st.caps[r.cap]; return `<tr class="${r.cap === st.me ? 'me' : ''}"><td class="n">${r.pos === 1 ? '🏆' : r.pos}</td><td><b>${esc(c.nick)}</b></td><td class="n">${r.pts}</td><td class="n">${r.firsts}</td><td class="n">${sbMoney(c.spent)}</td><td class="sb-fl">${sbLine(c)}</td></tr>`; }).join('') +
      `</tbody></table>${votes ? `<div style="margin-top:12px">${votes}</div>` : ''}</div>`;
  }
  function sbRender(){
    const box = $('p-sb'), st = SBC.st;
    if (!st){
      box.innerHTML = `<div class="card" style="max-width:640px"><h3>Subasta</h3>
        <div class="fv-note" style="margin-top:6px">Hasta 5 capitanes (6 si los capitanes también salen a subasta), con ${sbMoney(1000)} cada uno, compran 6 jugadores: 5 titulares y un suplente comodín (5 si no alcanzan los jugadores para tantos capitanes). Salen jugadores al azar, de cualquier rol, y cada uno se descubre cuando le toca. La puja es abierta: cualquiera sube cuando quiera y, cuando se acaba el tiempo sin nuevas pujas, se lo lleva el mejor postor. Quien crea la sala dirige: empieza, saca cada jugador y puede adjudicar antes. Al final cada capitán reparte a sus jugadores en los 5 roles (puede ponerlos fuera de su rol).</div>
        <div class="fv-err">${esc(SBC.err)}</div><button class="fv-btn pri" id="sb-create" style="margin-top:12px">Crear subasta</button></div>${sbRankHtml()}`;
      const b = $('sb-create'); if (b) b.onclick = () => sbAct('create'); return;
    }
    const link = `<div class="fv-invite"><label>Enlace</label><input id="sb-link" readonly value="${esc(sbUrl(st.code))}"><button class="fv-btn sm" id="sb-copy">Copiar enlace</button>
      <span class="exp">Comparte el enlace: se pueden unir hasta ${st.maxCaps} capitanes (tú incluido). La sala se borra tras 3 h sin actividad.</span></div>`;
    const caps = `<div class="sb-capgrid n${st.caps.length}">${st.caps.map((_, k) => sbCapCard(st, k)).join('')}</div>`;
    let body = '';
    if (st.status === 'lobby') body = `${link}<h3 class="sb-h">Capitanes (${st.caps.length}/${st.maxCaps})</h3>${caps}
      <label class="sb-opt">${st.isHost ? `<input type="checkbox" id="sb-capsin" ${st.capsInPool ? 'checked' : ''}>` : (st.capsInPool ? '✓' : '✗')} <span><b>Los capitanes también salen a subasta</b> · un capitán puede terminar jugando en el equipo de otro (o comprarse a sí mismo). Con esta opción la sala admite hasta 6 capitanes.</span></label>
      <label class="sb-opt">${st.isHost ? `<input type="checkbox" id="sb-clues" ${st.clues ? 'checked' : ''}>` : (st.clues ? '✓' : '✗')} <span><b>Modo pistas</b> · cada jugador sale misterioso y se descubre en 3 pistas (su rol de torneo, una partida suya sin decir cuál era él, y un campeón que jugó) antes de revelar el nombre. Se puede pujar desde la primera pista.</span></label>
      <div class="fv-err">${esc(SBC.err)}</div>
      <div class="sb-btns">${st.me < 0 && st.caps.length < st.maxCaps ? `<button class="fv-btn pri" id="sb-join">Unirme como capitán</button>` : ''}
      ${st.isHost ? `<button class="fv-btn pri" id="sb-start" ${st.caps.length >= 2 ? '' : 'disabled'}>Empezar subasta</button><span class="fv-note">Mínimo 2 capitanes.</span>` : st.me >= 0 ? `<span class="fv-note">${esc(st.hostNick)} empieza cuando estén todos.</span>` : ''}</div>`;
    else {
      const head = st.status === 'assign' ? `<div class="card sb-done"><h3>Subasta terminada · armen sus equipos</h3><div class="fv-note">Cada capitán reparte a sus jugadores en los 5 roles${st.teamSize > 5 ? ' + suplente' : ''} y confirma. Cuando confirmen todos, viene la votación para ordenar los equipos.</div></div>`
        : st.status === 'vote' ? sbVoteHtml(st) : st.status === 'done' ? sbFinalHtml(st) + sbRankHtml() : '';
      body = `${head}${st.status === 'auction' ? sbLotHtml(st) : ''}${caps}${sbBoard(st)}
        ${st.log.length ? `<div class="card" style="margin-top:14px"><h3>Historial</h3>${st.log.map(l => `<div class="sb-log">${sbIco(l.p.role)}<b>${esc(l.p.nick)}</b> → ${l.cap == null ? 'sin pujas' : esc(st.caps[l.cap].nick) + ' · ' + (l.price ? sbMoney(l.price) : 'gratis')}<small>${esc(l.how || '')}</small></div>`).join('')}</div>` : ''}`;
    }
    const hostBar = st.isHost ? `<div class="sb-host"><span>Anfitrión</span>${st.status !== 'lobby' ? `<button class="fv-btn sm" id="sb-reset">↺ Reiniciar subasta</button>` : ''}<button class="fv-btn sm sb-drop" id="sb-close">Cerrar subasta</button></div>` : '';
    const hadFocus = document.activeElement && document.activeElement.id === 'sb-amt';   // escribir un monto no se interrumpe al redibujar
    box.innerHTML = hostBar + body;
    const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    on('sb-close', () => { if (confirm('¿Cerrar la subasta? Se borra la sala y el enlace deja de funcionar.')) sbAct('close'); });
    on('sb-join', () => sbAct('join')); on('sb-leave', () => sbAct('leave'));
    box.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => sbAct('leave', { k: +b.dataset.kick }));
    const ci = $('sb-capsin'); if (ci) ci.onchange = () => sbAct('host', { action: 'settings', capsInPool: ci.checked });
    const cq = $('sb-clues'); if (cq) cq.onchange = () => sbAct('host', { action: 'settings', clues: cq.checked });
    on('sb-clue', () => sbAct('host', { action: 'clue' }));
    on('sb-start', () => sbAct('host', { action: 'start' })); on('sb-next', () => sbAct('host', { action: 'next' }));
    on('sb-hammer', () => sbAct('host', { action: 'hammer' }));
    on('sb-reset', () => { if (confirm('¿Reiniciar? Se borran las pujas y los equipos, y vuelven a la sala de espera con los mismos capitanes (al empezar se sortean jugadores nuevos).')) sbAct('reset'); });
    on('sb-copy', async e => { const b = e.target; try { await navigator.clipboard.writeText(sbUrl(st.code)); } catch (err) { const i = $('sb-link'); i.select(); try { document.execCommand('copy'); } catch (e2) {} }
      b.textContent = '¡Copiado!'; setTimeout(() => { b.textContent = 'Copiar enlace'; }, 1500); });
    box.querySelectorAll('[data-bid]').forEach(b => b.onpointerdown = e => { e.preventDefault(); sbAct('bid', { amount: +b.dataset.bid }); });
    const ai = $('sb-amt'); if (ai) ai.oninput = () => { SBC.amt = ai.value; };
    const bc = $('sb-bidc'); if (bc) bc.onpointerdown = e => { e.preventDefault(); sbAct('bid', { amount: +($('sb-amt').value || 0) }); };
    if (ai){ ai.onkeydown = e => { if (e.key === 'Enter') sbAct('bid', { amount: +(ai.value || 0) }); };
      if (hadFocus){ ai.focus(); try { const n = ai.value.length; ai.setSelectionRange(n, n); } catch (e) {} } }
    // reparto: al elegir a alguien que ya estaba en otro puesto, se intercambian
    box.querySelectorAll('select[data-slot]').forEach(sel => sel.onchange = () => {
      const me = SBC.st.caps[SBC.st.me], slots = {}; SBC.st.slots.forEach((s, n) => { slots[s] = me.lineup[n] ? me.lineup[n].i : ''; });
      const v = sel.value === '' ? '' : +sel.value, prev = slots[sel.dataset.slot];
      for (const s of Object.keys(slots)) if (v !== '' && slots[s] === v && s !== sel.dataset.slot) slots[s] = prev;
      slots[sel.dataset.slot] = v; sbAct('assign', { slots }); });
    on('sb-confirm', () => sbAct('confirm')); on('sb-unconfirm', () => sbAct('confirm', { on: false }));
    box.querySelectorAll('[data-vup],[data-vdown]').forEach(b => b.onclick = () => { const n = +(b.dataset.vup ?? b.dataset.vdown), m = b.dataset.vup != null ? n - 1 : n + 1, o = SBC.vorder;
      [o[n], o[m]] = [o[m], o[n]]; sbRender(); });
    on('sb-vote', () => sbAct('vote', { order: SBC.vorder }));
    sbClock();
  }
  function sbClock(){ document.querySelectorAll('#p-sb .sb-clock').forEach(el => { const s = Math.max(0, Math.ceil((+el.dataset.left - (Date.now() - +el.dataset.at)) / 1000)); el.textContent = s + ' s'; el.classList.toggle('low', s <= 5); }); }
  setInterval(sbClock, 250);
  // refresco cada 1 s (no mientras escribes un monto o eliges en el reparto, para no cortarte)
  setInterval(() => { if (CUR_TAB === 'sb' && !document.hidden && SBC.room && rkLogged() && !(document.activeElement && document.activeElement.matches && document.activeElement.matches('#p-sb select'))) sbLoad(false); }, 1000);

  // ---- ranking histórico de la subasta: los jugadores más caros ----
  let SB_RANK = null;
  async function sbRankLoad(){ try { const r = await fetch('/api/subasta/ranking', { cache:'no-store' }); if (r.ok) SB_RANK = await r.json(); } catch (e) {} }
  function sbRankHtml(){
    if (!SB_RANK) return '';
    return `<div class="card" style="margin-top:14px;max-width:760px"><h3>Los más caros de la historia</h3><div class="cap">El precio más alto que se pagó por cada jugador en todas las subastas.</div>` +
      (SB_RANK.length ? `<table class="lb-rk"><thead><tr><th class="n">#</th><th>Jugador</th><th class="n">Récord</th><th>Lo pagó</th><th class="n">Veces comprado</th><th class="n">Promedio</th></tr></thead><tbody>` +
        SB_RANK.map((r, k) => `<tr><td class="n">${k === 0 ? '👑' : k + 1}</td><td><b>${esc(r.nick || r.rid)}</b></td><td class="n"><b class="sb-gold">${sbMoney(r.top)}</b></td><td>${esc(r.buyer || '')}</td><td class="n">${r.n}</td><td class="n">${sbMoney(r.avg)}</td></tr>`).join('') + `</tbody></table>`
        : `<div class="fv-note">Todavía no hay ventas guardadas.</div>`) + `</div>`;
  }

  // SoloQdle embebido: el marco toma el alto de su contenido
  setInterval(() => { if (CUR_TAB !== 'dle') return; const f = $('dle-frame'); try { const h = f.contentDocument.documentElement.scrollHeight; if (h && Math.abs(f.offsetHeight - h) > 4) f.style.height = h + 'px'; } catch (e) {} }, 400);
  const h0 = (location.hash || '').slice(1);
  showTab(h0 === 'analisis' ? 'analisis' : (h0 === 'rk' || h0 === 'ranked') ? 'rk' : (h0 === 'soloqdle' || h0 === 'dle') ? 'dle' : (h0 === 'sb' || h0 === 'subasta' || SBC.room) ? 'sb' : 'fv');
</script>
</body>
</html>
