<!doctype html>
<html lang="es">
<head>
<script src="auth-fetch.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoloQ Challenge — Equipo</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
  :root{
    --bg:#0b0b0b; --panel:#0b0c10; --panel-2:#121319; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#fff; --muted:rgba(255,255,255,.55); --muted-2:rgba(255,255,255,.38);
    --accent:#e9ff1f; --up:#34d399; --down:#fb7185; --gold:#ffd24a; --blue:#4aa3ff; --red:#ff5d6c;
    --font:'General Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:radial-gradient(1100px 550px at 50% -200px, rgba(233,255,31,.05), transparent 60%), var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button, input, select, textarea{ font-family:inherit; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 20px; }
  header{ border-bottom:1px solid var(--line); }
  main.wrap{ padding-bottom:60px; }
  h1{ font-size:30px; letter-spacing:-.02em; margin:26px 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:18px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .empty{ text-align:center; padding:40px 10px; color:var(--muted); font-size:14px; }
  .empty b{ display:block; color:var(--text); font-size:16px; margin-bottom:4px; }
  .pills{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pill{ cursor:pointer; background:var(--panel-2); border:1px solid var(--line-2); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:700; }
  .pill.on{ background:var(--accent); color:#0b0b0b; border-color:var(--accent); }
  .tabs{ display:flex; gap:4px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:4px; width:max-content; max-width:100%; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button{ cursor:pointer; background:none; border:0; color:var(--muted); font-size:13px; font-weight:700; padding:8px 14px; border-radius:9px; }
  .tabs button.on{ background:var(--panel-2); color:var(--text); box-shadow:inset 0 0 0 1px var(--line-2); }
  .tabs .n{ display:inline-block; margin-left:6px; background:var(--down); color:#000; border-radius:999px; font-size:10px; padding:1px 6px; }
  .btn{ cursor:pointer; background:var(--panel-2); border:1px solid var(--line-2); color:var(--text); border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; }
  .btn.pri{ background:var(--accent); color:#0b0b0b; border-color:var(--accent); }
  .btn.ghost{ background:none; color:var(--muted); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .muted{ color:var(--muted); } .up{ color:var(--up); } .down{ color:var(--down); }
  /* partidas */
  .gl{ display:flex; flex-direction:column; gap:10px; }
  .g{ background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line-2); border-radius:12px; padding:12px 14px; }
  .g.w{ border-left-color:var(--up); } .g.l{ border-left-color:var(--down); }
  .g.click{ cursor:pointer; } .g.click:hover{ background:rgba(255,255,255,.03); }
  .gh{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
  .gh .res{ font-weight:800; } .g.w .res{ color:var(--up); } .g.l .res{ color:var(--down); }
  .badge{ font-size:10.5px; font-weight:800; letter-spacing:.03em; padding:3px 8px; border-radius:6px; background:rgba(255,255,255,.07); color:var(--muted); }
  .badge.torneo{ background:rgba(255,210,74,.14); color:var(--gold); } .badge.scrim{ background:rgba(74,163,255,.14); color:var(--blue); }
  .badge.wait{ background:rgba(233,255,31,.1); color:var(--accent); }
  .sides{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-top:10px; }
  .side{ display:flex; flex-direction:column; gap:3px; } .side.r{ text-align:right; align-items:flex-end; }
  .side .lbl{ font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--muted-2); text-transform:uppercase; }
  .icons{ display:flex; gap:3px; } .icons img, .icons i{ width:30px; height:30px; border-radius:7px; background:var(--panel-2); display:block; }
  .names{ font-size:11.5px; color:var(--muted); max-width:100%; }
  .vs{ font-size:11px; font-weight:800; color:var(--muted-2); }
  .gc{ margin-top:8px; font-size:12.5px; color:var(--muted); white-space:pre-wrap; }
  .wr-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .wr-box{ flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
  .wr-l{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .wr-v{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; margin:2px 0; } .wr-s{ font-size:12px; color:var(--muted); }
  .form{ display:grid; grid-template-columns:150px 200px 1fr 120px; gap:8px; margin-top:12px; align-items:start; }
  .form textarea{ grid-column:1 / -1; min-height:56px; resize:vertical; }
  .form input, .form select, .form textarea{ background:var(--panel-2); border:1px solid var(--line-2); color:var(--text); border-radius:9px; padding:8px 10px; font-size:13px; width:100%; }
  .form .act{ grid-column:1 / -1; display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  .form .err{ color:var(--down); font-size:12px; margin-right:auto; }
  @media (max-width:700px){ .form{ grid-template-columns:1fr; } .sides{ grid-template-columns:1fr; } .side.r{ text-align:left; align-items:flex-start; } .vs{ display:none; } }
  /* detalle */
  .det{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.78); display:none; place-items:center; padding:14px; }
  .dbox{ width:min(1120px,100%); max-height:calc(100vh - 28px); overflow-y:auto; background:var(--panel); border:1px solid var(--line-2); border-radius:18px; padding:16px 18px; }
  .dhead{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:12px; }
  .dhead b{ font-size:19px; } .dhead .meta{ font-size:13px; color:var(--muted); margin-top:3px; }
  .x{ cursor:pointer; background:none; border:0; color:var(--muted); font-size:18px; }
  .tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .tbl th{ text-align:left; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); padding:6px 8px; font-weight:800; }
  .tbl td{ padding:6px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  .tbl .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .th-team{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 8px 6px; font-size:13px; }
  .th-team b{ font-size:14px; } .th-team.blue b{ color:var(--blue); } .th-team.red b{ color:var(--red); }
  .ch{ position:relative; width:34px; height:34px; } .ch img{ width:34px; height:34px; border-radius:8px; display:block; }
  .ch em{ position:absolute; right:-4px; bottom:-4px; font-style:normal; font-size:9.5px; font-weight:800; background:#000; border:1px solid var(--line-2); border-radius:5px; padding:0 3px; }
  .sp{ display:flex; flex-direction:column; gap:2px; } .sp img{ width:16px; height:16px; border-radius:3px; display:block; }
  .its{ display:flex; gap:2px; } .its img, .its i{ width:22px; height:22px; border-radius:4px; background:var(--panel-2); display:block; }
  .pn{ font-weight:700; white-space:nowrap; max-width:170px; overflow:hidden; text-overflow:ellipsis; }
  .bars{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; }
  .bar-row{ display:grid; grid-template-columns:26px 1fr 64px; gap:8px; align-items:center; font-size:12px; margin:4px 0; }
  .bar-row img{ width:24px; height:24px; border-radius:6px; }
  .an-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:12px; margin-bottom:14px; }
  .an-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
  .an-card h4{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted-2); margin:0 0 8px; display:flex; justify-content:space-between; gap:8px; }
  .an-mu{ display:grid; grid-template-columns:34px 1fr auto 1fr 34px; gap:8px; align-items:center; }
  .an-mu img{ width:34px; height:34px; border-radius:8px; } .an-mu .nm{ font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .an-mu .nm.r{ text-align:right; }
  .an-mu .vs{ font-size:10.5px; color:var(--muted-2); font-weight:800; }
  .an-rows{ margin-top:8px; display:flex; flex-direction:column; gap:5px; }
  .an-row{ display:grid; grid-template-columns:72px 1fr 92px 1fr 72px; gap:6px; align-items:center; font-size:12px; font-variant-numeric:tabular-nums; }
  .an-row .l{ text-align:right; font-weight:700; } .an-row .r{ font-weight:700; } .an-row .m{ text-align:center; color:var(--muted); font-size:11px; }
  .an-bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; display:flex; } .an-bar.l{ justify-content:flex-end; }
  .an-bar i{ display:block; height:100%; border-radius:3px; } .an-bar.l i{ background:var(--blue); } .an-bar.r i{ background:var(--red); }
  .an-verdict{ margin-top:8px; font-size:12.5px; font-weight:700; } .an-verdict.w{ color:var(--up); } .an-verdict.l{ color:var(--down); } .an-verdict.e{ color:var(--muted); }
  .an-facts{ display:flex; flex-direction:column; gap:6px; } .an-facts div{ font-size:13px; line-height:1.4; padding:8px 10px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); }
  .an-obj{ display:flex; flex-wrap:wrap; gap:6px; } .an-obj span{ font-size:12px; padding:5px 9px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); }
  .an-obj span.us{ border-color:rgba(74,163,255,.5); } .an-obj span.them{ border-color:rgba(255,93,108,.5); }
  .an-note{ font-size:11.5px; color:var(--muted-2); margin:-4px 0 12px; }
  .bar{ height:8px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; } .bar i{ display:block; height:100%; border-radius:4px; }
  .obj{ display:grid; grid-template-columns:1fr auto 1fr; gap:6px 14px; max-width:420px; margin:0 auto 14px; font-size:13px; text-align:center; }
  .obj .l{ text-align:right; font-weight:800; } .obj .rr{ text-align:left; font-weight:800; } .obj .m{ color:var(--muted); }
  .stats-wrap{ overflow-x:auto; } .stats th img{ width:28px; height:28px; border-radius:6px; display:block; margin:0 auto; }
  .stats td:first-child{ color:var(--muted); white-space:nowrap; } .stats .best{ color:var(--accent); font-weight:800; }
  .runes{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .rp{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .rp .top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px; font-weight:700; } .rp .top img{ width:28px; height:28px; border-radius:7px; }
  .rp .row{ display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; } .rp .row img{ width:26px; height:26px; border-radius:50%; background:#000; }
  .rp .row img.ks{ width:36px; height:36px; } .rp small{ font-size:11px; color:var(--muted); }
  .chart{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:12px; }
  .chart h4{ font-size:12.5px; margin:0 0 6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chart select{ background:var(--panel); color:var(--text); border:1px solid var(--line-2); border-radius:7px; padding:3px 6px; font-size:12px; }
  .lg{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; margin-top:6px; } .lg span{ display:inline-flex; align-items:center; gap:4px; } .lg i{ width:10px; height:3px; border-radius:2px; display:inline-block; }
</style>

<script src="api.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const fdate = v => v ? new Date(v).toLocaleString('es-CL', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  const dur = s => s ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
  const fk = v => v == null ? '–' : v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(v);
  const S = { me: null, team: null, box: 'history', games: [], inboxN: 0, dd: null, open: null, tab: 'tablero' };
  try { S.team = localStorage.getItem('sqc_team_sel'); } catch (e) {}

  // ---------- Data Dragon (íconos de campeones, ítems, hechizos y runas) ----------
  async function ddLoad(){
    if (S.dd) return S.dd;
    let ver = '16.20.1'; try { ver = (await (await fetch('https://ddragon.leagueoflegends.com/api/versions.json')).json())[0]; } catch (e) {}
    const get = async f => { try { return await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${ver}/data/es_MX/${f}.json`)).json(); } catch (e) { return null; } };
    const [ch, sm, rr, cr] = await Promise.all([get('champion'), get('summoner'), get('runesReforged'), fetch('/api/ranked/champs').then(r => r.json()).catch(() => [])]);
    const roles = {}; (cr || []).forEach(c => { roles[c.id] = c.roles || []; });
    const champ = {}, champName = {}; Object.values((ch && ch.data) || {}).forEach(c => { champ[c.key] = c.id; champName[c.id] = c.name; });
    const spell = {}; Object.values((sm && sm.data) || {}).forEach(s => { spell[s.key] = s.image.full; });
    const rune = {}; (rr || []).forEach(st => { rune[st.id] = { icon: st.icon, name: st.name }; st.slots.forEach(sl => sl.runes.forEach(r => { rune[r.id] = { icon: r.icon, name: r.name }; })); });
    S.dd = { ver, champ, champName, spell, rune, roles }; return S.dd;
  }
  const cIcon = id => { const d = S.dd; if (!d || !id) return ''; const k = /^\d+$/.test(String(id)) ? d.champ[id] : id; return k ? `https://ddragon.leagueoflegends.com/cdn/${d.ver}/img/champion/${k}.png` : ''; };
  const cName = id => { const d = S.dd; if (!d || !id) return ''; const k = /^\d+$/.test(String(id)) ? d.champ[id] : id; return d.champName[k] || k || ''; };
  const iIcon = id => id ? `<img src="https://ddragon.leagueoflegends.com/cdn/${S.dd.ver}/img/item/${id}.png" alt="" loading="lazy">` : '<i></i>';
  const sIcon = id => S.dd.spell[id] ? `<img src="https://ddragon.leagueoflegends.com/cdn/${S.dd.ver}/img/spell/${S.dd.spell[id]}" alt="">` : '';
  const rIcon = (id, cls) => S.dd.rune[id] ? `<img class="${cls || ''}" src="https://ddragon.leagueoflegends.com/cdn/img/${S.dd.rune[id].icon}" alt="" title="${esc(S.dd.rune[id].name)}">` : '';
  const SHARD = { 5008:'Fuerza adaptable', 5005:'Velocidad de ataque', 5007:'Aceleración de habilidades', 5002:'Armadura', 5003:'Resistencia mágica', 5001:'Vida (escalable)', 5010:'Velocidad de movimiento', 5011:'Vida', 5013:'Tenacidad' };

  // ---------- carga ----------
  async function boot(){
    SQC.preNav(); SQC.mountNav();
    if (!(window.SQC && SQC.token && SQC.token())){ $('app').innerHTML = `<div class="card empty"><b>Inicia sesión</b>El historial del equipo es privado. <a href="cuenta.html" style="color:var(--accent)">Iniciar sesión</a></div>`; return; }
    try { S.me = await SQC.api('/team/me'); } catch (e) { $('app').innerHTML = `<div class="card empty"><b>Solo para integrantes de un equipo</b>${esc(e.message)}</div>`; return; }
    if (!S.me.teams.length){ $('app').innerHTML = `<div class="card empty"><b>No perteneces a ningún equipo de la organización</b>Si es un error, pídele a un admin que te agregue al roster.</div>`; return; }
    if (!S.me.teams.some(t => t.team === S.team)) S.team = S.me.teams[0].team;
    await ddLoad(); await loadGames();
  }
  const myTeam = () => S.me.teams.find(t => t.team === S.team) || {};
  async function loadGames(){
    try {
      const h = await SQC.api('/team/' + encodeURIComponent(S.team) + '/games?box=' + S.box);
      S.games = h.games;
      // historial catalogado (para sugerir el nombre del rival en la bandeja)
      S.hist = S.box === 'history' ? h.games : (await SQC.api('/team/' + encodeURIComponent(S.team) + '/games?box=history').catch(() => ({ games: [] }))).games;
      if (myTeam().captain){ const ib = S.box === 'inbox' ? h : await SQC.api('/team/' + encodeURIComponent(S.team) + '/games?box=inbox'); S.inboxN = ib.games.length; } else S.inboxN = 0;
    } catch (e) { S.games = []; S.err = e.message; }
    render();
  }
  // ---------- vista ----------
  function sidesHtml(g){
    const ps = (g.summary && g.summary.players) || [], us = ps.filter(p => p.teamId === g.side), them = ps.filter(p => p.teamId !== g.side);
    const icons = arr => arr.map(p => p.champ ? `<img src="${cIcon(p.champ)}" alt="" title="${esc(String(p.rid).split('#')[0])} · ${esc(cName(p.champ))}${p.k != null ? ' · ' + p.k + '/' + p.d + '/' + p.a : ''}">` : '<i></i>').join('');
    return `<div class="sides"><div class="side"><span class="lbl">${esc(S.team)}</span><div class="icons">${icons(us)}</div><div class="names">${us.map(p => esc(String(p.rid).split('#')[0])).join(', ')}</div></div>
      <span class="vs">VS</span>
      <div class="side r"><span class="lbl">${esc(g.rival || 'Rival')}</span><div class="icons">${icons(them)}</div><div class="names">${them.map(p => esc(String(p.rid).split('#')[0])).join(', ')}</div></div></div>`;
  }
  function headHtml(g){
    return `<div class="gh"><span class="res">${g.won ? 'Victoria' : 'Derrota'}</span><span class="muted">${fdate(g.game_at)} · ${dur(g.duration)}</span>
      ${g.kind ? `<span class="badge ${g.kind}">${g.kind === 'torneo' ? '🏆 ' + esc(g.tournament || 'Torneo') : 'Scrim'}</span>` : ''}
      ${g.rival ? `<span>vs <b>${esc(g.rival)}</b></span>` : ''}${g.game_no ? `<span class="badge">Game ${g.game_no}</span>` : ''}
      ${g.status === 'requested' ? `<span class="badge wait" title="Se baja sola cuando un jugador de esa partida tenga el overlay abierto">⏳ esperando datos del overlay</span>` : ''}</div>`;
  }
  function render(){
    const t = myTeam(), ts = S.me.teams;
    let html = '';

  // ---------- análisis ----------

  function roleScore(p, role, dur){
    const s = p.st, cid = /^\d+$/.test(String(p.championId)) ? S.dd.champ[p.championId] : p.championId, list = (S.dd.roles || {})[cid] || [];
    const items = [0, 1, 2, 3, 4, 5, 6].map(i => s['item' + i]), sp = p.spells || [];

    else if (sp.includes(11)) v -= 8;
    if (role === 'UTILITY'){ if (items.some(i => SUP_ITEMS.has(i))) v += 12; if ((s.totalMinionsKilled || 0) < 60 && dur > 900) v += 4; if (sp.includes(3)) v += 2; }
    if (role === 'BOTTOM' && (sp.includes(7) || sp.includes(21) || sp.includes(1))) v += 2;

  }
  const PERMS = (() => { const out = []; (function pm(a, r){ if (!r.length){ out.push(a); return; } r.forEach((x, i) => pm(a.concat(x), r.filter((_, j) => j !== i))); })([], ROLES); return out; })();
  function assignRoles(ps, dur, fixed){
    fixed = fixed || {};

    for (const pr of PERMS){ const sc = ps.reduce((t, p, i) => t + roleScore(p, pr[i], dur) + (fixed[p.pid] ? (fixed[p.pid] === pr[i] ? 100 : -100) : 0), 0); if (sc > bs){ bs = sc; best = pr; } }
    const m = {}; ps.forEach((p, i) => { m[p.pid] = best[i]; }); return m;
  }
  const champRoles = p => { const cid = /^\d+$/.test(String(p.championId)) ? S.dd.champ[p.championId] : p.championId; return (S.dd.roles || {})[cid] || []; };
  const hasSupItem = p => [0, 1, 2, 3, 4, 5, 6].some(i => SUP_ITEMS.has(p.st['item' + i]));
  // ¿puede este jugador haber jugado ese rol? (por su campeón, Castigo o ítem de support)
  const canPlay = (p, role) => champRoles(p).includes(role) || (role === 'JUNGLE' && (p.spells || []).includes(11)) || (role === 'UTILITY' && hasSupItem(p));
  // Roles de nuestro equipo con el roster: Castigo = jungla siempre; el rol del roster vale salvo que el campeón sea de otro
  // rol y nadie más del equipo pudiera cubrir ese rol (ahí se pregunta al capitán).
  function ourFixedRoles(ps, roster){
    const fixed = {}, ask = [], smite = ps.filter(p => (p.spells || []).includes(11));
    if (smite.length === 1) fixed[smite[0].pid] = 'JUNGLE';
    const rr = p => roster[String(p.rid || '').toLowerCase().replace(/\s+/g, '')];
    const count = {}; ps.forEach(p => { const r = rr(p); if (r) count[r] = (count[r] || 0) + 1; });
    for (const p of ps){
      if (fixed[p.pid]) continue;
      const R = rr(p); if (!R || count[R] > 1) continue;              // sin rol en el roster, o dos con el mismo rol
      if (R === 'JUNGLE' && smite.length === 1) continue;            // el jungla del roster no llevó Castigo: otro jungleó
      const cr = champRoles(p);
      if (!cr.length || cr.includes(R)){ fixed[p.pid] = R; continue; }

  }
  const atMin = (tl, m) => { const f = tl.frames; let b = f[0]; for (const x of f) if (Math.abs(x.t - m * 60) < Math.abs(b.t - m * 60)) b = x; return b; };
  const sign = v => (v > 0 ? '+' : '') + v;
  function analysisHtml(){
    const g = S.open, d = g.data, tl = g.timeline && g.timeline.frames && g.timeline.frames.length ? g.timeline : null, us = g.side, them = us === 100 ? 200 : 100;
    const dur = d.duration || 0, mins = dur / 60;
    const P = { [us]: d.players.filter(p => p.teamId === us), [them]: d.players.filter(p => p.teamId === them) };
    const manual = g.roles || null, roster = g.rosterRoles || {};
    const ourRoles = manual ? null : ourFixedRoles(P[us], roster);
    const R = manual ? { ...assignRoles(P[us], dur, manual), ...assignRoles(P[them], dur, manual) }

    const askHtml = !manual && ourRoles.ask.length ? `<div class="an-card" style="border-color:rgba(233,255,31,.45);margin-bottom:12px"><h4><span>¿Qué rol jugó cada uno?</span></h4>
      <div style="font-size:13px;line-height:1.5">${ourRoles.ask.map(x => `<b>${pName(x.p)}</b> es ${ROLE_ES[x.R]} en el roster pero jugó <b>${esc(cName(x.p.championId))}</b> (${x.cr.map(r => ROLE_ES[r]).join('/')}), y nadie más del equipo podía ir de ${x.cr.map(r => ROLE_ES[r]).join('/')}.`).join('<br>')}
      ${myTeam().captain ? ' Confirma los roles abajo (en "Corregir roles") para que el análisis compare bien.' : ''}</div></div>` : '';
    const byRole = (team, role) => P[team].find(p => R[p.pid] === role);
    const lbl = id => id === us ? esc(S.team) : esc(g.rival || 'Rival');
    const tK = team => P[team].reduce((t, p) => t + (p.st.kills || 0), 0), tDmg = team => P[team].reduce((t, p) => t + (p.st.totalDamageDealtToChampions || 0), 0), tGold = team => P[team].reduce((t, p) => t + (p.st.goldEarned || 0), 0);
    const kp = p => { const k = tK(p.teamId); return k ? Math.round(((p.st.kills || 0) + (p.st.assists || 0)) / k * 100) : 0; };
    const dShare = p => { const t = tDmg(p.teamId); return t ? Math.round((p.st.totalDamageDealtToChampions || 0) / t * 100) : 0; };
    const gShare = p => { const t = tGold(p.teamId); return t ? Math.round((p.st.goldEarned || 0) / t * 100) : 0; };
    const cs = p => (p.st.totalMinionsKilled || 0) + (p.st.neutralMinionsKilled || 0), cspm = p => mins ? (cs(p) / mins).toFixed(1) : '0';
    const ev = tl ? (tl.events || []) : [], early = e => e.t < 900;
    const killsBefore = (pid, t) => ev.filter(e => e.y === 'K' && e.k === pid && e.t < t).length, deathsBefore = (pid, t) => ev.filter(e => e.y === 'K' && e.v === pid && e.t < t).length;
    const soloKills = (pid, vpid) => ev.filter(e => e.y === 'K' && early(e) && e.k === pid && e.v === vpid && !(e.a || []).length).length;
    const fr = m => tl ? atMin(tl, m) : null, val = (f, p, i) => f ? (f.p[p.pid - 1] || [])[i] || 0 : 0;
    const csAt = (f, p) => val(f, p, 2) + val(f, p, 3);
    // fila comparativa: valor nuestro vs rival con barras
    const row = (label, a, b, fmt) => { const mx = Math.max(Math.abs(a), Math.abs(b), 1); fmt = fmt || (v => v);
      return `<div class="an-row"><span class="l">${fmt(a)}</span><span class="an-bar l"><i style="width:${Math.round(Math.abs(a) / mx * 100)}%"></i></span><span class="m">${label}</span><span class="an-bar r"><i style="width:${Math.round(Math.abs(b) / mx * 100)}%"></i></span><span class="r">${fmt(b)}</span></div>`; };
    // ---- duelos por rol ----
    const duel = role => {
      const a = byRole(us, role), b = byRole(them, role); if (!a || !b) return '';
      const f10 = fr(10), f15 = fr(15), rows = [];
      let score = 0;   // + = ganamos la línea
      if (tl && dur >= 900){
        const g15 = val(f15, a, 0) - val(f15, b, 0), x15 = val(f15, a, 1) - val(f15, b, 1); score += g15 / 300 + x15 / 400;
        rows.push(row('Oro min 10', val(f10, a, 0), val(f10, b, 0), fk), row('Oro min 15', val(f15, a, 0), val(f15, b, 0), fk), row('Exp. min 15', val(f15, a, 1), val(f15, b, 1), fk));
        if (role !== 'UTILITY'){ const c15 = csAt(f15, a) - csAt(f15, b); score += c15 / 15; rows.push(row(role === 'JUNGLE' ? 'Campamentos 15' : 'CS min 15', csAt(f15, a), csAt(f15, b))); }
        const ka = killsBefore(a.pid, 900), kb = killsBefore(b.pid, 900), da = deathsBefore(a.pid, 900), db = deathsBefore(b.pid, 900); score += (ka - kb) * 0.6 - (da - db) * 0.6;
        rows.push(row('Kills / muertes 15', `${ka}/${da}`, `${kb}/${db}`));
        if (role === 'TOP' || role === 'MIDDLE' || role === 'BOTTOM'){ const sa = soloKills(a.pid, b.pid), sb = soloKills(b.pid, a.pid); if (sa || sb) rows.push(row('Solo kills (1v1)', sa, sb)); }
      }
      // lo importante de cada rol al final de la partida
      const S2 = { TOP: [['Daño a campeones', 'totalDamageDealtToChampions', fk], ['Daño a torres', 'damageDealtToTurrets', fk], ['Daño recibido', 'totalDamageTaken', fk]],
        JUNGLE: [['Daño a objetivos', 'damageDealtToObjectives', fk], ['Visión', 'visionScore'], ['Daño a campeones', 'totalDamageDealtToChampions', fk]],
        MIDDLE: [['Daño a campeones', 'totalDamageDealtToChampions', fk], ['Daño a torres', 'damageDealtToTurrets', fk]],
        BOTTOM: [['Daño a campeones', 'totalDamageDealtToChampions', fk], ['Daño a torres', 'damageDealtToTurrets', fk]],
        UTILITY: [['Visión', 'visionScore'], ['Wards puestas', 'wardsPlaced'], ['Wards destruidas', 'wardsKilled'], ['Pinks', 'visionWardsBoughtInGame'], ['Control (s)', 'timeCCingOthers']] }[role];
      S2.forEach(([t, k, f]) => rows.push(row(t, a.st[k] || 0, b.st[k] || 0, f)));
      if (role !== 'UTILITY' && role !== 'JUNGLE') rows.push(row('CS / min', +cspm(a), +cspm(b)));
      if (role === 'BOTTOM' || role === 'MIDDLE') rows.push(row('% daño del equipo', dShare(a), dShare(b), v => v + '%'));
      rows.push(row('Part. en kills', kp(a), kp(b), v => v + '%'));
      const what = role === 'JUNGLE' ? 'el early' : 'la línea';
      const verdict = !tl || dur < 900 ? '' : score > 1.2 ? `<div class="an-verdict w">Ganó ${what} antes del 15</div>` : score < -1.2 ? `<div class="an-verdict l">Perdió ${what} antes del 15</div>` : `<div class="an-verdict e">${role === 'JUNGLE' ? 'Early parejo' : 'Línea pareja'} hasta el 15</div>`;
      return `<div class="an-card"><h4><span>${ROLE_ES[role]}</span><span>${role === 'JUNGLE' ? 'early y objetivos' : role === 'UTILITY' ? 'visión y control' : 'fase de líneas'}</span></h4>
        <div class="an-mu"><img src="${cIcon(a.championId)}" alt=""><span class="nm">${pName(a)}<br><small class="muted">${esc(cName(a.championId))}</small></span><span class="vs">VS</span><span class="nm r">${pName(b)}<br><small class="muted">${esc(cName(b.championId))}</small></span><img src="${cIcon(b.championId)}" alt=""></div>
        <div class="an-rows">${rows.join('')}</div>${verdict}</div>`;
    };
    // ---- objetivos (orden en que cayeron) ----
    const pidTeam = {}; d.players.forEach(p => { pidTeam[p.pid] = p.teamId; });
    const OBJ = e => e.y === 'M' ? (/BARON/.test(e.m) ? '👑 Barón' : /DRAGON/.test(e.m) ? '🐉 ' + (({ AIR_DRAGON: 'Nube', FIRE_DRAGON: 'Infernal', EARTH_DRAGON: 'Montaña', WATER_DRAGON: 'Océano', HEXTECH_DRAGON: 'Hextech', CHEMTECH_DRAGON: 'Quimtech', ELDER_DRAGON: 'Ancestral' })[e.s] || 'Dragón') : /HERALD/.test(e.m) ? '🦀 Heraldo' : /HORDE|GRUB/.test(e.m) ? '🪲 Larvas' : '⚔ ' + e.m) : e.y === 'B' ? (/INHIB/.test(e.s) ? '🏰 Inhibidor' : '🗼 Torre') : '';
    const objs = ev.filter(e => (e.y === 'M' || e.y === 'B')).map(e => { const team = e.y === 'B' ? (e.tm === 100 ? 200 : e.tm === 200 ? 100 : pidTeam[e.k]) : pidTeam[e.k]; return { t: e.t, team, txt: OBJ(e) }; });

    const ft = firstOf(/Torre/); if (ft) facts.push(`🗼 <b>Primera torre</b> para ${lbl(ft.team)} al minuto ${Math.floor(ft.t / 60)}.`);
    if (tl){ const diff = tl.frames.map(f => ({ t: f.t, v: f.p.reduce((s2, x, i) => s2 + (pidTeam[i + 1] === us ? x[0] : -x[0]), 0) }));
      const mx = diff.reduce((a, b) => b.v > a.v ? b : a), mn = diff.reduce((a, b) => b.v < a.v ? b : a);
      if (mx.v > 1000) facts.push(`📈 Mayor ventaja de ${esc(S.team)}: <b>+${fk(mx.v)}</b> de oro al minuto ${Math.round(mx.t / 60)}.`);
      if (mn.v < -1000) facts.push(`📉 Mayor desventaja: <b>${fk(mn.v)}</b> de oro al minuto ${Math.round(mn.t / 60)}${g.won ? ' — y aun así ganaron (remontada)' : ''}.`);
      const f15 = fr(15); if (f15 && dur >= 900){ const v15 = f15.p.reduce((s2, x, i) => s2 + (pidTeam[i + 1] === us ? x[0] : -x[0]), 0); facts.push(`⏱ Al minuto 15 ${esc(S.team)} iba <b>${v15 >= 0 ? '+' : ''}${fk(v15)}</b> de oro.`); } }
    const topKp = ours.slice().sort((a, b) => kp(b) - kp(a))[0]; if (topKp) facts.push(`🤝 ${pName(topKp)} participó en el <b>${kp(topKp)}%</b> de las kills del equipo.`);

    const noDeath = ours.filter(p => !p.st.deaths); if (noDeath.length) facts.push(`🛡 Sin morir en toda la partida: ${noDeath.map(pName).join(', ')}.`);
    const dr = { us: objs.filter(o => /Dragón|Nube|Infernal|Montaña|Océano|Hextech|Quimtech|Ancestral/.test(o.txt) && o.team === us).length, them: objs.filter(o => /Dragón|Nube|Infernal|Montaña|Océano|Hextech|Quimtech|Ancestral/.test(o.txt) && o.team === them).length };
    if (dr.us + dr.them) facts.push(`🐉 Dragones: ${esc(S.team)} ${dr.us} – ${dr.them} ${lbl(them)}.`);
    const vis = (team) => P[team].reduce((t, p) => t + (p.st.visionScore || 0), 0); facts.push(`👁 Visión total: ${esc(S.team)} ${vis(us)} vs ${vis(them)} ${lbl(them)}.`);
    const lanes = ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY'];
    return `${askHtml}${!tl ? `<div class="an-note">Esta partida llegó sin línea de tiempo: el análisis de early (min 10 y 15) no está disponible.</div>` : `<div class="an-note">Roles detectados automáticamente (campeón, hechizos, ítems y farm). Barras: <span style="color:var(--blue)">${esc(S.team)}</span> a la izquierda, <span style="color:var(--red)">${lbl(them)}</span> a la derecha.</div>`}

      ${myTeam().captain ? rolesEditor(P, R, lbl) : ''}
      <div class="an-grid"><div class="an-card"><h4><span>Datos de la partida</span></h4><div class="an-facts">${facts.map(f => `<div>${f}</div>`).join('')}</div></div>

  function rolesEditor(P, R, lbl){

  function bindRolesEditor(){

  // ---------- gráficos (SVG simple) ----------
  const PCOL = ['#4aa3ff', '#7dd3fc', '#34d399', '#a78bfa', '#e9ff1f', '#ff5d6c', '#fb923c', '#f472b6', '#facc15', '#f87171'];
  function lineChart(series, opts){

  }

    $('ch-metric').onchange = draw; draw();
  }
  boot();
