<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoloQ Challenge — SoloQdle</title>
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');
  :root{
    --bg:#0b0b0b; --panel:#0b0c10; --panel-2:#121319; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --text:#fff; --muted:rgba(255,255,255,.55); --muted-2:rgba(255,255,255,.38);
    --accent:#e9ff1f; --up:#34d399; --down:#fb7185; --gold:#ffd24a;
    --font:'General Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; }
  body{ background:radial-gradient(1100px 550px at 50% -200px, rgba(233,255,31,.05), transparent 60%), var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:680px; margin:0 auto; padding:0 20px; }
  h1{ font-size:30px; font-weight:700; margin-top:8px; } h1 .dle-n{ color:var(--accent); }
  .sub{ color:var(--muted); font-size:13.5px; line-height:1.45; margin:6px 0 20px; }

  .dle-clues{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 8px; margin-bottom:16px; }
  .dle-clues .ch{ font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--muted-2); padding:8px 8px 4px; }
  .grow{ display:grid; grid-template-columns:22px 1fr auto auto; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; }
  .grow + .grow{ margin-top:2px; }
  .grow:nth-child(even){ background:rgba(255,255,255,.02); }
  .grow .gi{ color:var(--muted-2); font-weight:800; font-size:12px; }
  .grow .gk{ font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .grow .gk .d{ color:var(--down); }
  .grow .gd{ font-size:11px; color:var(--muted-2); }
  .grow .gr{ font-weight:800; font-size:11px; letter-spacing:.05em; padding:2px 9px; border-radius:6px; }
  .gr.w{ color:#05271d; background:var(--up); } .gr.l{ color:#fff; background:var(--down); }

  .dle-guessbox{ position:relative; }
  #dle-input{ width:100%; font-family:inherit; font-size:15px; padding:13px 14px; border-radius:12px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--text); }
  #dle-input:focus{ outline:none; border-color:var(--accent); }
  #dle-input:disabled{ opacity:.5; }
  .dle-ac{ position:absolute; left:0; right:0; top:54px; z-index:20; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:12px; overflow:hidden; max-height:260px; overflow-y:auto; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  .dle-ac:empty{ display:none; }
  .dle-ac button{ display:block; width:100%; text-align:left; font-family:inherit; font-size:14px; font-weight:600; color:var(--text); background:none; border:0; padding:11px 14px; cursor:pointer; }
  .dle-ac button:hover, .dle-ac button.sel{ background:rgba(233,255,31,.1); }
  .dle-legend{ font-size:11px; color:var(--muted-2); margin:9px 2px 16px; line-height:1.4; }

  .dle-guesses{ display:flex; flex-direction:column; gap:6px; }
  .gcol-h, .grw{ display:grid; grid-template-columns:1.4fr 1fr .9fr .9fr .8fr; gap:6px; }
  .gcol-h{ font-size:9px; font-weight:800; letter-spacing:.04em; color:var(--muted-2); padding:0 4px 2px; }
  .gcol-h span{ text-align:center; } .gcol-h span:first-child{ text-align:left; }
  .gcell{ padding:9px 6px; border-radius:9px; text-align:center; font-size:12px; font-weight:700; background:var(--panel-2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-height:46px; }
  .gcell.nm{ text-align:left; align-items:flex-start; font-size:13.5px; font-weight:800; }
  .gcell.ok{ background:rgba(52,211,153,.18); border-color:rgba(52,211,153,.5); }
  .gcell.bad{ background:rgba(251,113,133,.13); border-color:rgba(251,113,133,.35); }
  .gcell .arw{ font-size:15px; line-height:1; }
  .gcell .sm{ font-size:9.5px; color:var(--muted-2); font-weight:600; }

  .dle-result{ margin-top:18px; text-align:center; background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; padding:18px; }
  .dle-result .big{ font-size:19px; font-weight:800; }
  .dle-result .ans{ color:var(--accent); }
  .dle-share{ margin-top:12px; font-family:inherit; font-size:14px; font-weight:800; padding:11px 22px; border-radius:10px; border:0; background:var(--accent); color:#000; cursor:pointer; }
  .dle-giveup{ display:block; margin:16px auto 40px; font-family:inherit; font-size:12px; color:var(--muted-2); background:none; border:0; cursor:pointer; text-decoration:underline; }
  .dle-giveup[hidden]{ display:none; }

  .dle-tabs{ display:flex; gap:6px; margin:14px 0 4px; }
  .dle-tabs button{ font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--panel-2); color:var(--muted); cursor:pointer; }
  .dle-tabs button.on{ background:var(--accent); color:#000; border-color:var(--accent); }

  .cgrid{ overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .cg-h, .crw{ display:grid; grid-template-columns:72px 82px 62px 62px 70px 70px 52px 54px 56px; gap:5px; min-width:640px; }
  .cg-h{ font-size:9px; font-weight:800; letter-spacing:.02em; color:var(--muted-2); padding:0 2px 5px; align-items:end; }
  .cg-h span{ text-align:center; line-height:1.15; }
  .crw{ margin-bottom:6px; }
  .ccell{ padding:8px 4px; border-radius:9px; text-align:center; font-size:11.5px; font-weight:700; background:var(--panel-2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; }
  .ccell.ok{ background:rgba(52,211,153,.18); border-color:rgba(52,211,153,.5); }
  .ccell.bad{ background:rgba(251,113,133,.13); border-color:rgba(251,113,133,.35); }
  .ccell.ico{ padding:4px; }
  .ccell.ico img, .ccell.ico .ph{ width:34px; height:34px; border-radius:8px; object-fit:cover; background:var(--panel); display:grid; place-items:center; font-size:14px; font-weight:800; color:var(--muted); }
  .ccell .arw{ font-size:14px; line-height:1; }
  .ccell .sm{ font-size:9px; color:var(--muted-2); font-weight:600; }

  .dle-gate{ text-align:center; background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; padding:34px 20px; }
  .dle-gate .big{ font-size:18px; font-weight:800; }
  .dle-gate .sub{ margin:8px 0 18px; }
  .dle-gate a{ display:inline-block; font-family:inherit; font-size:14px; font-weight:800; padding:11px 24px; border-radius:10px; background:var(--accent); color:#000; }

  .dle-board{ margin:34px 0 60px; }
  .dle-board h2{ font-size:15px; font-weight:800; letter-spacing:.02em; margin-bottom:4px; }
  .dle-board .sub{ margin:0 0 12px; }
  .bd-h, .bd-r{ display:grid; grid-template-columns:30px 1fr .8fr .8fr .8fr; gap:8px; align-items:center; }
  .bd-h{ font-size:9px; font-weight:800; letter-spacing:.04em; color:var(--muted-2); padding:0 10px 6px; }
  .bd-h span{ text-align:center; } .bd-h span:nth-child(2){ text-align:left; }
  .bd-r{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:6px; }
  .bd-r .pos{ font-weight:800; color:var(--muted-2); text-align:center; font-variant-numeric:tabular-nums; }
  .bd-r .who{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px; min-width:0; }
  .bd-r .who img, .bd-r .who .ph{ width:24px; height:24px; border-radius:50%; object-fit:cover; flex:0 0 auto; background:var(--panel); display:grid; place-items:center; font-size:11px; color:var(--muted); }
  .bd-r .who span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bd-r .v{ text-align:center; font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; }
  .bd-r .v small{ display:block; font-size:9px; color:var(--muted-2); font-weight:600; }
  .bd-r.me{ border-color:rgba(233,255,31,.45); background:rgba(233,255,31,.06); }
  .bd-top1 .pos{ color:var(--gold); }
</style>

<script src="api.js"></script>
<script>
SQC.preNav(); SQC.mountNav();
const $ = id => document.getElementById(id);
const MAX = 8;
const abbrevTeam = t => t ? ({'Zenith':'Zenith','Hundred Blossom':'H. Blossom','Tide':'Tide','Exilium':'Exilium'}[t] || t) : '—';
function absLabel(abs){ if (abs == null) return '—'; if (abs >= 2800) return (abs-2800)+' LP';
  const TN=['Hierro','Bronce','Plata','Oro','Plat','Esm','Dia'], DN=['IV','III','II','I'];
  const ti=Math.min(6,Math.floor(abs/400)), rem=abs-ti*400, di=Math.min(3,Math.floor(rem/100)), lp=rem-di*100;
  return `${TN[ti]} ${DN[di]}`; }
const arw = d => d==='up' ? '<span class="arw" style="color:var(--up)">▲</span>' : d==='down' ? '<span class="arw" style="color:var(--down)">▼</span>' : d==='eq' ? '<span class="arw" style="color:var(--gold)">✓</span>' : '';

const MODES = {
  classic: { label:'🧩 Clásico',     short:'clásico',  guess:'/soloqdle2/guess', reveal:'/soloqdle2/reveal',
             sub:'Adivina el jugador por sus <b>atributos</b>. Cada intento pinta en <span style="color:var(--up)">verde</span> lo que coincide y las flechas ▲/▼ te dicen si el jugador correcto tiene más o menos. Solo cuenta la <b>cuenta más alta</b> de cada jugador.' },
  games:   { label:'🎮 Por partidas', short:'partidas', guess:'/soloqdle/guess',  reveal:'/soloqdle/reveal',
             sub:'Adivina de qué jugador del torneo son estas partidas. Solo ves el <b>KDA</b> y si <b>ganó o perdió</b> — ni campeón, ni ítems, ni rol.' },
};
const TABS = [ {id:'classic'}, {id:'games'}, {id:'board', label:'🏆 Scoreboard'} ];
const roleLbl = r => r || '—';
let DLE = null, ME = null, MODE = 'classic', sel = -1, acList = [], BOARD = null;
const ST = { games:null, classic:null };
const S = () => ST[MODE];
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stateKey(m){ return 'dle_' + m + '_' + (DLE ? DLE.date : 'x'); }
function loadState(m){ try { return JSON.parse(localStorage.getItem(stateKey(m)) || 'null'); } catch(e){ return null; } }
function saveState(){ try { localStorage.setItem(stateKey(MODE), JSON.stringify(S())); } catch(e){} }
function freshState(){ return { rows:[], done:false, won:false, answerNm:null }; }

// ---------- Pistas del modo "por partidas" ----------
function cluesHTML(){
  if (!DLE.clueGames) return '';
  return `<div class="dle-clues"><div class="ch">ÚLTIMAS PARTIDAS DE ESTE JUGADOR</div>`
    + DLE.clueGames.map((g,i) => `<div class="grow">
        <span class="gi">${i+1}</span>
        <span class="gk">${g.k}/<span class="d">${g.d}</span>/${g.a}</span>
        <span class="gd">${g.durMin} min</span>
        <span class="gr ${g.win?'w':'l'}">${g.win?'VICTORIA':'DERROTA'}</span></div>`).join('') + `</div>`;
}
function guessRowGames(r){
  const cell = (label, sub, cls) => `<div class="gcell ${cls||''}">${label}${sub?`<span class="sm">${sub}</span>`:''}</div>`;
  return `<div class="grw">
    ${cell(esc(r.nm),'','nm '+(r.correct?'ok':'bad'))}
    ${cell(abbrevTeam(r.team),'', r.cmp.team==='match'?'ok':(r.cmp.team==='no'?'bad':''))}
    ${cell(absLabel(r.eloAbs), arw(r.cmp.elo))}
    ${cell(absLabel(r.peakAbs), arw(r.cmp.peak))}
    ${cell(r.games, arw(r.cmp.games))}</div>`;
}

// ---------- Grilla del modo "clásico" ----------
function guessRowClassic(r){
  const cls = c => c==='match'?'ok':(c==='no'?'bad':'');
  const num = (label, dir) => `<div class="ccell ${dir==='eq'?'ok':''}">${label}${arw(dir)}</div>`;
  const cat = (label, c) => `<div class="ccell ${cls(c)}">${esc(label)}</div>`;
  const ico = r.avatar ? `<img src="${esc(r.avatar)}">` : `<span class="ph">${esc((r.nm||'?').slice(0,1).toUpperCase())}</span>`;
  return `<div class="crw">
    <div class="ccell ico ${r.correct?'ok':''}">${ico}<span class="sm">${esc((r.nm||'').slice(0,7))}</span></div>
    ${cat(abbrevTeam(r.team), r.cmp.team)}
    ${cat(roleLbl(r.roleMost), r.cmp.roleMost)}
    ${cat(roleLbl(r.roleLeast), r.cmp.roleLeast)}
    ${num(absLabel(r.eloAbs), r.cmp.elo)}
    ${num(absLabel(r.peakAbs), r.cmp.peak)}
    ${num(r.wr!=null?r.wr+'%':'—', r.cmp.wr)}
    ${num(r.kda!=null?r.kda:'—', r.cmp.kda)}
    ${num(r.games, r.cmp.games)}</div>`;
}
function classicBody(st){
  const rowsH = st.rows.length ? `<div class="cgrid"><div class="cg-h">
      <span>Jugador</span><span>Equipo</span><span>Rol<br>más jugado</span><span>Rol<br>menos jugado</span><span>Elo</span><span>Peak</span><span>WR</span><span>KDA</span><span>Games</span></div>`
      + st.rows.map(guessRowClassic).join('') + `</div>` : '';
  return { legend: `Intentos: <b>${st.rows.length}/${MAX}</b> · <b>Rol más / menos jugado</b>: entre los roles que el jugador sí ha jugado.`, rowsH };
}

function renderTabs(){
  $('dle-tabs').innerHTML = TABS.map(t =>
    `<button data-m="${t.id}" class="${t.id===MODE?'on':''}">${t.label || MODES[t.id].label}</button>`).join('');
  $('dle-tabs').querySelectorAll('button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  $('dle-sub').innerHTML = MODE==='board' ? 'Ranking global e histórico del SoloQdle — combina ambos modos.' : MODES[MODE].sub;
}
function render(){
  renderTabs();
  if (MODE === 'board'){ renderBoard(); return; }
  if (!ME){ showGate(); return; }
  if (!DLE){ $('dle-app').innerHTML = '<div class="sub" style="text-align:center;padding:40px 0">No se pudo cargar el juego.</div>'; return; }
  const st = S(), done = st.done;
  let bodyTop, legend, rowsH;
  if (MODE === 'classic'){ bodyTop = ''; const cb = classicBody(st); legend = cb.legend; rowsH = cb.rowsH; }
  else { bodyTop = cluesHTML(); legend = `Intentos: <b>${st.rows.length}/${MAX}</b> · al fallar te digo si el correcto tiene más ▲ / menos ▼ de elo, peak LP y partidas, y si es del mismo equipo.`;
         rowsH = st.rows.length ? `<div class="gcol-h"><span>Jugador</span><span>Equipo</span><span>Elo</span><span>Peak</span><span>Games</span></div>` + st.rows.map(guessRowGames).join('') : ''; }
  let resultH = '';
  if (done){
    resultH = `<div class="dle-result"><div class="big">${st.won ? '🎉 ¡Correcto!' : '💀 Fin'} <span class="ans">${esc(st.answerNm||'')}</span></div>
      <div class="sub" style="margin:6px 0 0">${st.won ? `Lo sacaste en ${st.rows.length} intento${st.rows.length===1?'':'s'}.` : 'Vuelve mañana por otro.'}</div>
      <button class="dle-share" id="dle-share">📋 Compartir</button></div>`;
  }
  $('dle-app').innerHTML = bodyTop
    + (done ? '' : `<div class="dle-guessbox"><input id="dle-input" placeholder="Escribe un jugador…" autocomplete="off"><div class="dle-ac" id="dle-ac"></div></div>
        <div class="dle-legend">${legend}</div>`)
    + (MODE==='classic' ? rowsH : `<div class="dle-guesses">${rowsH}</div>`) + resultH
    + (done ? '' : `<button class="dle-giveup" id="dle-giveup">Me rindo y ver la respuesta</button>`);
  wire();
}
function setMode(m){ if (m===MODE) return; if (m!=='board' && !MODES[m]) return; MODE = m; if (m!=='board' && !ST[m]) ST[m] = loadState(m) || freshState(); sel = -1; acList = []; render(); if (m==='board') loadBoard(); }

function wire(){
  const input = $('dle-input');
  if (input){ input.addEventListener('input', onInput); input.addEventListener('keydown', onKey); input.focus(); }
  const gu = $('dle-giveup'); if (gu) gu.addEventListener('click', giveUp);
  const sh = $('dle-share'); if (sh) sh.addEventListener('click', share);
}
function guessedKeys(){ return new Set(S().rows.map(r => r.key)); }
function onInput(){
  const q = $('dle-input').value.trim().toLowerCase(); sel = -1;
  const used = guessedKeys();
  acList = q ? DLE.players.filter(p => !used.has(p.key) && (p.nm.toLowerCase().includes(q) || (p.alt||[]).some(a => (a||'').toLowerCase().includes(q)))).slice(0,8) : [];
  $('dle-ac').innerHTML = acList.map((p,i)=>`<button data-k="${p.key}">${esc(p.nm)}</button>`).join('');
  $('dle-ac').querySelectorAll('button').forEach(b => b.onclick = () => guess(b.dataset.k));
}
function onKey(e){
  if (e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,acList.length-1); paintSel(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); paintSel(); }
  else if (e.key==='Enter'){ e.preventDefault(); const p = acList[sel>=0?sel:0]; if (p) guess(p.key); }
}
function paintSel(){ $('dle-ac').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('sel',i===sel)); }

async function guess(key){
  const st = S(), cfg = MODES[MODE];
  if (st.done || guessedKeys().has(key)) return;
  let r; try { r = await SQC.api(cfg.guess, { method:'POST', body:{ key } }); } catch(e){ return; }
  st.rows.push({ key, ...r.guess, cmp:r.cmp, correct:r.correct });
  if (r.correct){ st.done = true; st.won = true; st.answerNm = r.answer && r.answer.nm; postResult(); }
  else if (st.rows.length >= MAX){ st.done = true; st.won = false; try { const a = await SQC.api(cfg.reveal); st.answerNm = a.nm; } catch(e){} postResult(); }
  saveState(); render();
}
async function giveUp(){
  const st = S(), cfg = MODES[MODE];
  if (!confirm('¿Rendirte y ver la respuesta?')) return;
  st.done = true; st.won = false;
  try { const a = await SQC.api(cfg.reveal); st.answerNm = a.nm; } catch(e){}
  postResult(); saveState(); render();
}
function postResult(){
  const st = S(); const mode = MODE;
  if (st.posted) return; st.posted = true;
  SQC.api('/soloqdle/result', { method:'POST', body:{ mode, solved: !!st.won, guesses: st.rows.length, gaveUp: !st.won } })
    .then(() => loadBoard()).catch(() => {});
}
function share(){
  const st = S();
  const grid = st.rows.map(r => r.correct ? '🟩' : '🟥').join('');
  const line = `SoloQdle ${DLE.number ? '#'+DLE.number : ''} (${MODES[MODE].short}) — ${st.won ? st.rows.length+'/'+MAX : 'X/'+MAX}\n${grid}\nsoloquchile.cl/soloqdle.html`;
  const btn = $('dle-share');
  (navigator.clipboard ? navigator.clipboard.writeText(line) : Promise.reject()).then(()=>{ btn.textContent='✅ Copiado'; }).catch(()=>{ prompt('Copia tu resultado:', line); });
}

async function loadBoard(){
  try { BOARD = (await SQC.api('/soloqdle/leaderboard?t=' + Date.now())).board || []; } catch(e){ BOARD = BOARD || []; }
  if (MODE === 'board') renderBoard();
}
function renderBoard(){
  const el = $('dle-app');
  if (BOARD === null){ el.innerHTML = `<div class="sub" style="text-align:center;padding:40px 0">Cargando scoreboard…</div>`; loadBoard(); return; }
  if (!BOARD.length){ el.innerHTML = `<div class="dle-board"><div class="sub" style="text-align:center;padding:30px 0">Aún nadie ha jugado. ¡Sé el primero!</div></div>`; return; }
  const myNm = ME && ME.nickname;
  const cell = (v, lbl) => `<div class="v">${v}<small>${lbl}</small></div>`;
  el.innerHTML = `<div class="dle-board">
    <div class="bd-h"><span>#</span><span>Jugador</span><span>Racha</span><span>Mejor</span><span>Resueltos</span></div>`
    + BOARD.map((p,i) => {
        const mine = myNm && p.nm === myNm;
        const ava = p.avatar ? `<img src="${esc(p.avatar)}">` : `<span class="ph">${esc((p.nm||'?').slice(0,1).toUpperCase())}</span>`;
        return `<div class="bd-r ${i===0?'bd-top1':''} ${mine?'me':''}">
          <div class="pos">${i+1}</div>
          <div class="who">${ava}<span>${esc(p.nm)}</span></div>
          ${cell((p.streak||0)+(p.streak?' 🔥':''),'días')}
          ${cell(p.best||0,'récord')}
          ${cell(p.total||0, p.avg?('~'+p.avg+' int'):'')}</div>`;
      }).join('') + `</div>`;
}

function showGate(){
  $('dle-app').innerHTML = `<div class="dle-gate">
    <div class="big">🔒 Inicia sesión para jugar</div>
    <div class="sub">El SoloQdle es solo para jugadores registrados del torneo. Inicia sesión para adivinar y competir por la racha.</div>
    <a href="cuenta.html">Iniciar sesión</a></div>`;
}

(async function init(){
  loadBoard();
  try { ME = await SQC.me(); } catch(e){ ME = null; }
  if (ME){
    try { DLE = await SQC.api('/soloqdle'); $('dle-n').textContent = DLE.number ? '#'+DLE.number : ''; } catch(e){}
    ST.games   = loadState('games')   || freshState();
    ST.classic = loadState('classic') || freshState();
  }
  render();
})();
</script>
</body>
</html>
